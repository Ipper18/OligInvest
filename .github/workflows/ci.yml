name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CI: 'true'
  UV_PYTHON_DOWNLOADS: never
jobs:
  repository:
    name: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node --test --test-reporter=dot scripts/check-repository.test.mjs
      - run: node --test --test-reporter=dot scripts/check-docs.test.mjs
      - run: node scripts/check-docs.mjs
      - run: node scripts/check-repository.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

  verify:
    name: ${{ matrix.check }}
    needs: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, unit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '12.4.2'
          run_install: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.16'
          enable-cache: false
      - run: pnpm install --frozen-lockfile
      - run: |
          uv sync --project apps/analytics --frozen --no-install-project --no-build --no-python-downloads
          uv sync --project apps/analytics --frozen --no-build-isolation --no-python-downloads
      - run: pnpm "ci:$CI_CHECK"
        env:
          CI_CHECK: ${{ matrix.check }}

  build:
    name: ${{ matrix.name }}
    needs: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'build (all)', omit: none }
          - { name: 'build (without analytics)', omit: analytics }
          - { name: 'build (without alerts)', omit: alerts }
          - { name: 'build (without education)', omit: education }
          - { name: 'build (without admin)', omit: admin }
          - { name: 'build (without quick-actions)', omit: quick-actions }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '12.4.2'
          run_install: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.16'
          enable-cache: false
      - run: pnpm install --frozen-lockfile
      - run: |
          uv sync --project apps/analytics --frozen --no-install-project --no-build --no-python-downloads
          uv sync --project apps/analytics --frozen --no-build-isolation --no-python-downloads
      - run: pnpm ci:build -- "$OMIT_MODULE"
        env:
          OMIT_MODULE: ${{ matrix.omit }}
