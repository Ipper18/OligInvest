# Local development only; synthetic data. See docs/07-wdrozenie/srodowisko-deweloperskie.md.
name: oliginvest-dev

services:
  postgres:
    image: postgres:18.6-trixie@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_DB: oliginvest_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Set a local development password}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - target: 5432
        published: "${DEV_POSTGRES_PORT:-5432}"
        host_ip: ${DEV_BIND_ADDRESS:?Set the host loopback address}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    shm_size: 128mb
    mem_limit: 768m

  valkey-queue:
    image: valkey/valkey:9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    user: valkey
    environment:
      VALKEY_PASSWORD: ${DEV_VALKEY_QUEUE_PASSWORD:?Set a local queue password}
    command:
      - sh
      - -ec
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec --save ""
    ports:
      - target: 6379
        published: "${DEV_VALKEY_QUEUE_PORT:-6379}"
        host_ip: ${DEV_BIND_ADDRESS:?Set the host loopback address}
    volumes:
      - valkey-queue-data:/data
    healthcheck:
      test: [CMD-SHELL, 'VALKEYCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m

  valkey-cache:
    image: valkey/valkey:9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    user: valkey
    environment:
      VALKEY_PASSWORD: ${DEV_VALKEY_CACHE_PASSWORD:?Set a local cache password}
    command:
      - sh
      - -ec
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly no --save ""
    ports:
      - target: 6379
        published: "${DEV_VALKEY_CACHE_PORT:-6380}"
        host_ip: ${DEV_BIND_ADDRESS:?Set the host loopback address}
    tmpfs:
      - /data:mode=1777,size=16m
    healthcheck:
      test: [CMD-SHELL, 'VALKEYCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 192m

  mailpit:
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - target: 1025
        published: "${DEV_SMTP_PORT:-1025}"
        host_ip: ${DEV_BIND_ADDRESS:?Set the host loopback address}
      - target: 8025
        published: "${DEV_MAILPIT_UI_PORT:-8025}"
        host_ip: ${DEV_BIND_ADDRESS:?Set the host loopback address}
    mem_limit: 128m

networks:
  default:
    internal: false

volumes:
  postgres-data:
  valkey-queue-data:
