        lowSample: {type: boolean, description: '`true` przy próbie < 20.'}
        hitRate: {type: [number, 'null']}
        averageWin: {$ref: '#/components/schemas/Money'}
        averageLoss: {$ref: '#/components/schemas/Money'}
        expectancy: {$ref: '#/components/schemas/Money'}
        profitFactor: {type: [number, 'null']}
        medianHoldingDays: {type: [number, 'null']}
        averageRMultiple: {type: [number, 'null']}
        processVsOutcome:
          type: object
          description: Liczba pozycji w ćwiartkach dobra/zła decyzja × dobry/zły wynik (z postmortemów).
          additionalProperties: {type: integer}
          example: {goodProcessGoodOutcome: 7, goodProcessBadOutcome: 3, badProcessGoodOutcome: 2, badProcessBadOutcome: 4}
    TargetWeight:
      type: object
      required: [weight]
      properties:
        instrumentId: {$ref: '#/components/schemas/Uuid'}
        assetClass: {type: string}
        weight: {type: number, minimum: 0, maximum: 1}
      oneOf:
        - {required: [instrumentId]}
        - {required: [assetClass]}
    TargetAllocationInput:
      type: object
      required: [name, targets]
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        accountId: {$ref: '#/components/schemas/Uuid'}
        targets: {type: array, minItems: 1, maxItems: 50, items: {$ref: '#/components/schemas/TargetWeight'}, description: 'Suma wag = 1 (± 1e-9).'}
        tolerance: {type: number, minimum: 0, maximum: 0.5, default: 0.05, description: 'Pasmo tolerancji jako ułamek (0.05 = ±5 p.p.).'}
    TargetAllocation:
      allOf:
        - {$ref: '#/components/schemas/TargetAllocationInput'}
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
            updatedAt: {$ref: '#/components/schemas/Timestamp'}
    InstrumentOverride:
      type: object
      minProperties: 1
      properties:
        assetClass: {type: string, enum: [equity, bond, cash, commodity, real_estate, crypto, mixed, other]}
        sectorCode: {type: string, maxLength: 40}
        country: {type: string, pattern: '^[A-Z]{2}$'}
        note: {type: string, maxLength: 280}

    # ── analytics ──
    AnalyticsRunType: {type: string, enum: [monte_carlo, optimization, stress_test, what_if, backtest, goal, rebalance]}
    AnalyticsRunStatus: {type: string, enum: [queued, running, done, failed, cancelled]}
    AnalyticsWarning:
      type: object
      required: [code, severity, message]
      properties:
        code: {type: string, example: SHORT_HISTORY}
        severity: {type: string, enum: [info, warning, critical]}
        message: {type: string}
    ComplianceBlock:
      type: object
      required: [disclaimerKey, disclaimerVersion, notInvestmentAdvice]
      properties:
        disclaimerKey: {type: string, example: analytics.monte_carlo}
        disclaimerVersion: {type: string, example: '2026-09'}
        notInvestmentAdvice: {type: boolean, const: true}
        howToReadKey: {type: string, description: 'Klucz treści „Jak czytać ten wynik” (FR-06.06).'}
    CashFlowPlan:
      type: object
      required: [amount, frequency]
      properties:
        amount: {$ref: '#/components/schemas/Money'}
        frequency: {type: string, enum: [monthly, quarterly, yearly]}
        startYear: {type: integer, minimum: 0, maximum: 40, default: 0}
        endYear: {type: integer, minimum: 0, maximum: 40}
        indexToInflation: {type: boolean, default: true}
    MonteCarloParams:
      type: object
      required: [horizonYears]
      properties:
        accountIds: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Uuid'}}
        horizonYears: {type: integer, minimum: 1, maximum: 40}
        paths: {type: integer, minimum: 100, maximum: 10000, default: 5000}
        model: {type: string, enum: [stationary_bootstrap, parametric_t], default: stationary_bootstrap}
        meanBlockMonths: {type: integer, minimum: 1, maximum: 24, default: 6}
        historyWindow: {type: string, enum: [full, last_10y], default: full}
        contributions: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/CashFlowPlan'}}
        withdrawals: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/CashFlowPlan'}}
        inflationRate: {type: number, minimum: 0, maximum: 0.2, default: 0.025}
        taxMode: {type: string, enum: [belka_simplified, none], default: belka_simplified}
        goal: {$ref: '#/components/schemas/Money'}
        proxyOverrides:
          type: array
          maxItems: 50
          items:
            type: object
            required: [instrumentId, proxyInstrumentId]
            properties:
              instrumentId: {$ref: '#/components/schemas/Uuid'}
              proxyInstrumentId: {$ref: '#/components/schemas/Uuid'}
        seed: {type: integer, minimum: 0}
    OptimizationParams:
      type: object
      required: [instrumentIds, method, window]
      properties:
        instrumentIds: {type: array, minItems: 2, maxItems: 50, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        method: {type: string, enum: [min_variance, hrp, max_sharpe, efficient_frontier, black_litterman]}
        window:
          type: object
          required: [from, to]
          properties:
            from: {$ref: '#/components/schemas/LocalDate'}
            to: {$ref: '#/components/schemas/LocalDate'}
        frequency: {type: string, enum: [daily, weekly], default: weekly}
        covariance: {type: string, enum: [ledoit_wolf, sample], default: ledoit_wolf}
        minWeight: {type: number, minimum: 0, maximum: 0.5, default: 0}
        maxWeight: {type: number, minimum: 0.01, maximum: 1, default: 0.2}
        expectedReturns: {type: string, enum: [shrinkage, capm], description: 'Wymagane dla max_sharpe i efficient_frontier.'}
        views:
          type: array
          description: Tylko black_litterman — poglądy z jawną pewnością.
          maxItems: 20
          items:
            type: object
            required: [instrumentId, expectedReturn, confidence]
            properties:
              instrumentId: {$ref: '#/components/schemas/Uuid'}
              expectedReturn: {type: number, minimum: -0.9, maximum: 2}
              confidence: {type: number, minimum: 0.01, maximum: 1}
        resamples: {type: integer, minimum: 0, maximum: 500, default: 200}
        riskFreeRate: {type: number, minimum: 0, maximum: 0.5}
    StressTestParams:
      type: object
      minProperties: 1
      properties:
        accountIds: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Uuid'}}
        historical: {type: array, maxItems: 10, items: {type: string, pattern: '^[a-z0-9_]{3,40}$'}, example: [gfc_2008, covid_2020]}
        hypothetical:
          type: array
          maxItems: 10
          items:
            type: object
            required: [kind]
            properties:
              kind: {type: string, enum: [index_shock, fx_shock, correlation_shock]}
              instrumentId: {$ref: '#/components/schemas/Uuid'}
              currency: {$ref: '#/components/schemas/CurrencyCode'}
              shock: {type: number, minimum: -0.9, maximum: 0.9}
              correlation: {type: number, minimum: 0, maximum: 1}
    WhatIfParams:
      type: object
      required: [changes]
      properties:
        accountIds: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Uuid'}}
        changes:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [instrumentId, amount]
            properties:
              instrumentId: {$ref: '#/components/schemas/Uuid'}
              amount: {$ref: '#/components/schemas/Money', description: 'Dodatnia = dokupienie, ujemna = sprzedaż.'}
        windowYears: {type: integer, minimum: 1, maximum: 10, default: 3}
        frequency: {type: string, enum: [daily, weekly], default: weekly}
    BacktestParams:
      type: object
      required: [universe, from, to, initialCapital]
      properties:
        strategyId: {$ref: '#/components/schemas/Uuid'}
        strategy: {$ref: '#/components/schemas/StrategyDefinition'}
        universe:
          type: object
          required: [kind]
          properties:
            kind: {type: string, enum: [instruments, index_members_pit, gpw_all_pit]}
            instrumentIds: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Uuid'}}
            indexCode: {type: string, enum: [WIG20, mWIG40, sWIG80]}
        from: {$ref: '#/components/schemas/LocalDate'}
        to: {$ref: '#/components/schemas/LocalDate'}
        initialCapital: {$ref: '#/components/schemas/Money'}
        costs:
          type: object
          properties:
            broker: {type: string, enum: [xtb, mbank, custom], default: xtb}
            commissionRatio: {type: number, minimum: 0, maximum: 0.02}
            commissionMin: {$ref: '#/components/schemas/Money'}
            fxCostRatio: {type: number, minimum: 0, maximum: 0.02, default: 0.005}
            slippage: {type: string, enum: [liquidity_buckets, fixed], default: liquidity_buckets}
            fixedSlippageRatio: {type: number, minimum: 0, maximum: 0.05}
        tax:
          type: object
          properties:
            enabled: {type: boolean, default: true}
            rate: {type: number, minimum: 0, maximum: 0.5, default: 0.19}
        sizing:
          type: object
          properties:
            method: {type: string, enum: [equal_weight, fixed_fraction, vol_target], default: equal_weight}
            fraction: {type: number, minimum: 0.01, maximum: 1}
            targetVolatility: {type: number, minimum: 0.01, maximum: 1}
            maxPositions: {type: integer, minimum: 1, maximum: 50, default: 10}
        validation:
          type: object
          properties:
            mode: {type: string, enum: [oos_split, walk_forward], default: walk_forward}
            inSampleRatio: {type: number, minimum: 0.5, maximum: 0.9, default: 0.7}
            fitYears: {type: integer, minimum: 1, maximum: 10, default: 3}
            testYears: {type: integer, minimum: 1, maximum: 5, default: 1}
            stepYears: {type: integer, minimum: 1, maximum: 5, default: 1}
        optimization:
          type: object
          description: Domyślnie wyłączona; iloczyn wartości siatki ≤ 500 (Z-19) — liczba prób `N` trafia do DSR.
          properties:
            enabled: {type: boolean, default: false}
            grid: {type: object, additionalProperties: {type: array, minItems: 1, maxItems: 20, items: {type: number}}}
        liquidity:
          type: object
          properties:
            maxAdvRatio: {type: number, minimum: 0.001, maximum: 0.2, default: 0.05}
            minMedianTurnover: {$ref: '#/components/schemas/Money'}
        benchmarkId: {$ref: '#/components/schemas/Uuid'}
        seed: {type: integer, minimum: 0}
      oneOf:
        - {required: [strategyId]}
        - {required: [strategy]}
    GoalParams:
      type: object
      required: [target, horizonYears]
      properties:
        accountIds: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Uuid'}}
        target: {$ref: '#/components/schemas/Money'}
        horizonYears: {type: integer, minimum: 1, maximum: 40}
        probabilities: {type: array, minItems: 1, maxItems: 3, items: {type: number, enum: [0.5, 0.75, 0.9]}, default: [0.5, 0.75, 0.9]}
        paths: {type: integer, minimum: 100, maximum: 10000, default: 5000}
        inflationRate: {type: number, minimum: 0, maximum: 0.2, default: 0.025}
        seed: {type: integer, minimum: 0}
    RebalanceParams:
      type: object
      required: [accountId, mode]
      properties:
        accountId: {$ref: '#/components/schemas/Uuid'}
        targetId: {$ref: '#/components/schemas/Uuid'}
        targets: {type: array, minItems: 1, maxItems: 50, items: {$ref: '#/components/schemas/TargetWeight'}}
        tolerance: {type: number, minimum: 0, maximum: 0.5, default: 0.05}
        mode: {type: string, enum: [full, buy_only]}
        newCash: {$ref: '#/components/schemas/Money'}
        minOrderValue: {$ref: '#/components/schemas/Money'}
        allowFractional: {type: boolean, default: false}
        estimateTax: {type: boolean, default: true}
      oneOf:
        - {required: [targetId]}
        - {required: [targets]}
    MonteCarloRunInput:
      type: object
      required: [type, params]
      properties:
        type: {type: string, const: monte_carlo}
        params: {$ref: '#/components/schemas/MonteCarloParams'}
    OptimizationRunInput:
      type: object
      required: [type, params]
      properties:
        type: {type: string, const: optimization}
        params: {$ref: '#/components/schemas/OptimizationParams'}
    StressTestRunInput:
      type: object
      required: [type, params]
      properties:
        type: {type: string, const: stress_test}
        params: {$ref: '#/components/schemas/StressTestParams'}
    WhatIfRunInput:
      type: object
      required: [type, params]
      properties:
        type: {type: string, const: what_if}
        params: {$ref: '#/components/schemas/WhatIfParams'}
    BacktestRunInput:
      type: object
      required: [type, params]
      properties:
        type: {type: string, const: backtest}
        params: {$ref: '#/components/schemas/BacktestParams'}
    GoalRunInput:
      type: object
      required: [type, params]
      properties:
        type: {type: string, const: goal}
        params: {$ref: '#/components/schemas/GoalParams'}
    RebalanceRunInput:
      type: object
      required: [type, params]
      properties:
        type: {type: string, const: rebalance}
        params: {$ref: '#/components/schemas/RebalanceParams'}
    AnalyticsRunInput:
      oneOf:
        - {$ref: '#/components/schemas/MonteCarloRunInput'}
        - {$ref: '#/components/schemas/OptimizationRunInput'}
        - {$ref: '#/components/schemas/StressTestRunInput'}
        - {$ref: '#/components/schemas/WhatIfRunInput'}
        - {$ref: '#/components/schemas/BacktestRunInput'}
        - {$ref: '#/components/schemas/GoalRunInput'}
        - {$ref: '#/components/schemas/RebalanceRunInput'}
      discriminator:
        propertyName: type
        mapping:
          monte_carlo: '#/components/schemas/MonteCarloRunInput'
          optimization: '#/components/schemas/OptimizationRunInput'
          stress_test: '#/components/schemas/StressTestRunInput'
          what_if: '#/components/schemas/WhatIfRunInput'
          backtest: '#/components/schemas/BacktestRunInput'
          goal: '#/components/schemas/GoalRunInput'
          rebalance: '#/components/schemas/RebalanceRunInput'
    PercentileFan:
      type: object
      required: [p5, p25, p50, p75, p95]
      properties:
        p5: {$ref: '#/components/schemas/NumberSeries'}
        p25: {$ref: '#/components/schemas/NumberSeries'}
        p50: {$ref: '#/components/schemas/NumberSeries'}
        p75: {$ref: '#/components/schemas/NumberSeries'}
        p95: {$ref: '#/components/schemas/NumberSeries'}
    MonteCarloResult:
      type: object
      required: [kind, currency, months, nominal, sensitivity]
      properties:
        kind: {type: string, const: monte_carlo}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        months: {type: array, items: {type: integer}, description: 'Oś w miesiącach od dziś.'}
        nominal: {$ref: '#/components/schemas/PercentileFan'}
        real: {$ref: '#/components/schemas/PercentileFan'}
        goalProbability: {type: [number, 'null']}
        maxDrawdownPercentiles:
          type: object
          properties:
            p5: {type: number}
            p50: {type: number}
            p95: {type: number}
        sensitivity:
          type: array
          description: Obowiązkowa tabela wrażliwości (§ 12.1).
          items:
            type: object
            required: [scenario, endValueP50, endValueP5]
            properties:
              scenario: {type: string, enum: [mean_minus_2pp, mean_plus_2pp, last_10y, full_history]}
              endValueP5: {type: number}
              endValueP50: {type: number}
              goalProbability: {type: [number, 'null']}
    OptimizationResult:
      type: object
      required: [kind, method, weights, expectedVolatility]
      properties:
        kind: {type: string, const: optimization}
        method: {type: string}
        weights:
          type: array
          items:
            type: object
            required: [instrumentId, weight, weightP5, weightP95]
            properties:
              instrumentId: {$ref: '#/components/schemas/Uuid'}
              weight: {type: number}
              weightP5: {type: number}
              weightP95: {type: number}
              currentWeight: {type: [number, 'null']}
        expectedVolatility: {type: number}
        expectedReturn: {type: [number, 'null'], description: 'Tylko przy jawnych założeniach stóp zwrotu.'}
        frontier:
          type: object
          properties:
            volatility: {$ref: '#/components/schemas/NumberSeries'}
            return: {$ref: '#/components/schemas/NumberSeries'}
    StressTestResult:
      type: object
      required: [kind, scenarios]
      properties:
        kind: {type: string, const: stress_test}
        scenarios:
          type: array
          items:
            type: object
            required: [key, name, kind, portfolioReturn, portfolioLoss, coverageRatio]
            properties:
              key: {type: string}
              name: {type: string}
              kind: {type: string, enum: [historical, hypothetical]}
              periodFrom: {$ref: '#/components/schemas/LocalDate'}
              periodTo: {$ref: '#/components/schemas/LocalDate'}
              portfolioReturn: {type: number}
              portfolioLoss: {$ref: '#/components/schemas/Money'}
              coverageRatio: {type: number, description: 'Udział wartości pokrytej danymi lub proxy (< 0.8 → odmowa).'}
              positions:
                type: array
                items:
                  type: object
                  required: [instrumentId, returnRatio]
                  properties:
                    instrumentId: {$ref: '#/components/schemas/Uuid'}
                    proxyInstrumentId: {$ref: '#/components/schemas/Uuid'}
                    returnRatio: {type: number}
                    loss: {$ref: '#/components/schemas/Money'}
    RiskSnapshot:
      type: object
      required: [volatility, maxDrawdown, largestWeight, averageCorrelation]
      properties:
        volatility: {type: number}
        maxDrawdown: {type: number}
        largestWeight: {type: number}
        averageCorrelation: {type: number}
        currencyShares: {type: object, additionalProperties: {type: number}}
    WhatIfResult:
      type: object
      required: [kind, before, after]
      properties:
        kind: {type: string, const: what_if}
        before: {$ref: '#/components/schemas/RiskSnapshot'}
        after: {$ref: '#/components/schemas/RiskSnapshot'}
    BacktestStats:
      type: object
      properties:
        cagr: {type: [number, 'null']}
        volatility: {type: [number, 'null']}
        sharpe: {type: [number, 'null']}
        sortino: {type: [number, 'null']}
        maxDrawdown: {type: [number, 'null']}
        trades: {type: integer}
        turnover: {type: [number, 'null']}
        costs: {$ref: '#/components/schemas/Money'}
        taxes: {$ref: '#/components/schemas/Money'}
    BacktestResult:
      type: object
      required: [kind, summary, outOfSample, equity, deflatedSharpe, overfitting, survivorshipWarning, lookAheadCheck]
      properties:
        kind: {type: string, const: backtest}
        summary: {$ref: '#/components/schemas/BacktestStats'}
        inSample: {$ref: '#/components/schemas/BacktestStats'}
        outOfSample: {$ref: '#/components/schemas/BacktestStats'}
        walkForward:
          type: array
          items:
            type: object
            required: [fitFrom, fitTo, testFrom, testTo, stats]
            properties:
              fitFrom: {$ref: '#/components/schemas/LocalDate'}
              fitTo: {$ref: '#/components/schemas/LocalDate'}
              testFrom: {$ref: '#/components/schemas/LocalDate'}
              testTo: {$ref: '#/components/schemas/LocalDate'}
              params: {type: object}
              stats: {$ref: '#/components/schemas/BacktestStats'}
        equity:
          type: object
          required: [t, strategy]
          properties:
            t: {$ref: '#/components/schemas/TimeAxis'}
            strategy: {$ref: '#/components/schemas/NumberSeries'}
            benchmark: {$ref: '#/components/schemas/NumberSeries'}
        deflatedSharpe:
          type: object
          required: [value, trials]
          properties:
            value: {type: [number, 'null'], description: 'Prawdopodobieństwo, że prawdziwy SR > 0 po korekcie o N prób.'}
            trials: {type: integer, minimum: 1}
        overfitting:
          type: object
          required: [flagged]
          properties:
            oosToIsRatio: {type: [number, 'null']}
            flagged: {type: boolean, description: '`true`, gdy wynik OOS < 60 % wyniku IS.'}
        regimes:
          type: array
          items:
            type: object
            required: [label]
            properties:
              label: {type: string}
              from: {$ref: '#/components/schemas/LocalDate'}
              to: {$ref: '#/components/schemas/LocalDate'}
              return: {type: [number, 'null']}
              sharpe: {type: [number, 'null']}
        survivorshipWarning: {type: boolean}
        lookAheadCheck: {type: string, enum: [passed, failed]}
    GoalResult:
      type: object
      required: [kind, target, horizonYears, requirements]
      properties:
        kind: {type: string, const: goal}
        target: {$ref: '#/components/schemas/Money'}
        horizonYears: {type: integer}
        requirements:
          type: array
          items:
            type: object
            required: [probability, monthlyContribution]
            properties:
              probability: {type: number}
              monthlyContribution: {$ref: '#/components/schemas/Money'}
    RebalanceResult:
      type: object
      required: [kind, orders, before, after, cashRemaining, totalCosts]
      properties:
        kind: {type: string, const: rebalance}
        orders:
          type: array
          items:
            type: object
            required: [instrumentId, side, quantity, value]
            properties:
              instrumentId: {$ref: '#/components/schemas/Uuid'}
              side: {type: string, enum: [BUY, SELL]}
              quantity: {$ref: '#/components/schemas/DecimalString'}
              estimatedPrice: {$ref: '#/components/schemas/DecimalString'}
              value: {$ref: '#/components/schemas/Money'}
              commission: {$ref: '#/components/schemas/Money'}
              fxCost: {$ref: '#/components/schemas/Money'}
              estimatedTax: {$ref: '#/components/schemas/Money'}
        before: {type: array, items: {$ref: '#/components/schemas/WeightRow'}}
        after: {type: array, items: {$ref: '#/components/schemas/WeightRow'}}
        skippedWithinTolerance: {type: array, items: {$ref: '#/components/schemas/Uuid'}}
        cashRemaining: {$ref: '#/components/schemas/Money'}
        totalCosts: {$ref: '#/components/schemas/Money'}
    WeightRow:
      type: object
      required: [key, weight]
      properties:
        key: {type: string}
        weight: {type: number}
    AnalyticsResult:
      oneOf:
        - {$ref: '#/components/schemas/MonteCarloResult'}
        - {$ref: '#/components/schemas/OptimizationResult'}
        - {$ref: '#/components/schemas/StressTestResult'}
        - {$ref: '#/components/schemas/WhatIfResult'}
        - {$ref: '#/components/schemas/BacktestResult'}
        - {$ref: '#/components/schemas/GoalResult'}
        - {$ref: '#/components/schemas/RebalanceResult'}
      discriminator:
        propertyName: kind
        mapping:
          monte_carlo: '#/components/schemas/MonteCarloResult'
          optimization: '#/components/schemas/OptimizationResult'
          stress_test: '#/components/schemas/StressTestResult'
          what_if: '#/components/schemas/WhatIfResult'
          backtest: '#/components/schemas/BacktestResult'
          goal: '#/components/schemas/GoalResult'
          rebalance: '#/components/schemas/RebalanceResult'
    AnalyticsRun:
      type: object
      required: [id, type, status, progress, params, createdAt, compliance]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        type: {$ref: '#/components/schemas/AnalyticsRunType'}
        status: {$ref: '#/components/schemas/AnalyticsRunStatus'}
        progress: {type: integer, minimum: 0, maximum: 100}
        params: {type: object, description: 'Parametry po uzupełnieniu wartości domyślnych.'}
        result: {$ref: '#/components/schemas/AnalyticsResult'}
        assumptions: {type: object, description: 'Blok założeń: dane, okno, model, koszty, podatki, proxy (FR-04.01).'}
        warnings: {type: array, items: {$ref: '#/components/schemas/AnalyticsWarning'}}
        compliance: {$ref: '#/components/schemas/ComplianceBlock'}
        reproducibility:
          type: object
          properties:
            seed: {type: integer}
            algorithmVersion: {type: string}
            dataVersion: {type: object}
            libraries: {type: object, additionalProperties: {type: string}}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [TIMEOUT, MEMORY_LIMIT, INSUFFICIENT_DATA, COVERAGE_TOO_LOW, INVALID_PARAMS, INTERNAL]}
            message: {type: string}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        startedAt: {$ref: '#/components/schemas/Timestamp'}
        finishedAt: {$ref: '#/components/schemas/Timestamp'}
        durationMs: {type: integer, minimum: 0}
    AnalyticsRunPage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AnalyticsRun'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    AnalyticsLimits:
      type: object
      required: [role, heavyRunsUsedToday, bounds]
      properties:
        role: {$ref: '#/components/schemas/Role'}
        heavyRunsPerDay: {type: [integer, 'null'], description: '`null` = brak dostępu do analiz ciężkich (rola user).'}
        heavyRunsUsedToday: {type: integer}
        bounds:
          type: object
          additionalProperties: {type: number}
          example: {monteCarloPaths: 10000, horizonYears: 40, optimizationInstruments: 50, optimizationResamples: 500, backtestCombinations: 500}
        timeoutsSeconds: {type: object, additionalProperties: {type: integer}, example: {monte_carlo: 60, optimization: 120, backtest: 300}}
    StressScenarioInput:
      type: object
      required: [name, kind, description, enabled]
      properties:
        name: {type: string, maxLength: 80}
        kind: {type: string, enum: [historical, hypothetical]}
        startDate: {$ref: '#/components/schemas/LocalDate'}
        endDate: {$ref: '#/components/schemas/LocalDate'}
        shocks: {type: object}
        description: {type: string, maxLength: 1000}
        enabled: {type: boolean}
    StressScenario:
      allOf:
        - {$ref: '#/components/schemas/StressScenarioInput'}
        - type: object
          required: [key]
          properties:
            key: {type: string, example: covid_2020}
    StrategyOperand:
      oneOf:
        - type: object
          required: [indicator]
          properties:
            indicator: {type: string, enum: [close, open, sma, ema, rsi, macd, macd_signal, bb_upper, bb_lower, atr]}
            params: {type: array, maxItems: 3, items: {type: number}}
        - type: object
          required: [value]
          properties:
            value: {type: number}
    StrategyCondition:
      type: object
      required: [left, operator, right]
      properties:
        left: {$ref: '#/components/schemas/StrategyOperand'}
        operator: {type: string, enum: [gt, lt, crosses_above, crosses_below]}
        right: {$ref: '#/components/schemas/StrategyOperand'}
    StrategyRuleGroup:
      type: object
      minProperties: 1
      properties:
        all: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/StrategyCondition'}}
        any: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/StrategyCondition'}}
    StrategyDefinition:
      type: object
      required: [version, entry, exit]
      description: Sygnał liczony na zamknięciu dnia d, realizacja po otwarciu d+1 (§ 12.7).
      properties:
        version: {type: integer, const: 1}
        entry: {$ref: '#/components/schemas/StrategyRuleGroup'}
        exit: {$ref: '#/components/schemas/StrategyRuleGroup'}
        stopLossAtrMultiple: {type: number, minimum: 0.5, maximum: 10}
        maxHoldingDays: {type: integer, minimum: 1, maximum: 1000}
    StrategyInput:
      type: object
      required: [name, definition]
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        definition: {$ref: '#/components/schemas/StrategyDefinition'}
    Strategy:
      allOf:
        - {$ref: '#/components/schemas/StrategyInput'}
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
            updatedAt: {$ref: '#/components/schemas/Timestamp'}

    # ── alerts ──
    AlertRuleType: {type: string, enum: [price_above, price_below, change_pct, indicator, portfolio_change, drawdown, allocation_drift, earnings, news]}
    PriceThresholdParams:
      type: object
      required: [threshold]
      properties:
        threshold: {$ref: '#/components/schemas/DecimalString'}
        basis: {type: string, enum: [last, close], default: last}
    ChangeParams:
      type: object
      required: [threshold]
      properties:
        threshold: {type: number, exclusiveMinimum: 0, maximum: 1, description: 'Wartość bezwzględna zmiany (ułamek).'}
        direction: {type: string, enum: [up, down, both], default: both}
        accountIds: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Uuid'}, description: 'Tylko portfolio_change.'}
    IndicatorAlertParams:
      type: object
      required: [indicator, condition]
      properties:
        indicator: {type: string, enum: [rsi, price_vs_sma, price_vs_ema, macd_cross, bb_break]}
        period: {type: integer, minimum: 2, maximum: 400}
        fast: {type: integer, minimum: 2, maximum: 100}
        slow: {type: integer, minimum: 3, maximum: 200}
        signal: {type: integer, minimum: 2, maximum: 100}
        stdDev: {type: number, minimum: 0.5, maximum: 4}
        level: {type: number}
        condition: {type: string, enum: [above, below, crosses_above, crosses_below]}
        basis: {type: string, enum: [daily_close, delayed], default: daily_close}
    DrawdownAlertParams:
      type: object
      required: [threshold]
      properties:
        threshold: {type: number, exclusiveMinimum: 0, maximum: 1}
        accountIds: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Uuid'}}
    AllocationDriftParams:
      type: object
      required: [targetId, threshold]
      properties:
        targetId: {$ref: '#/components/schemas/Uuid'}
        threshold: {type: number, exclusiveMinimum: 0, maximum: 0.5, description: 'Odchylenie wagi w ułamku (0.05 = 5 p.p.).'}
    EarningsAlertParams:
      type: object
      required: [daysBefore]
      properties:
        daysBefore: {type: integer, minimum: 1, maximum: 30}
    NewsAlertParams:
      type: object
      required: [minArticles, windowHours]
      properties:
        minArticles: {type: integer, minimum: 1, maximum: 100}
        windowHours: {type: integer, minimum: 1, maximum: 168}
    AlertRuleSettings:
      type: object
      properties:
        channels: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/NotificationChannel'}, default: [push, email]}
        cooldownMinutes: {type: integer, minimum: 5, maximum: 10080, default: 1440}
        hysteresis: {type: number, minimum: 0, maximum: 0.1, default: 0.005, description: 'Ułamek (w bazie jako procent `hysteresis_pct`).'}
        enabled: {type: boolean, default: true}
    AlertRuleInput:
      allOf:
        - {$ref: '#/components/schemas/AlertRuleSettings'}
        - type: object
          required: [type, params]
          properties:
            type: {$ref: '#/components/schemas/AlertRuleType'}
            instrumentId: {$ref: '#/components/schemas/Uuid'}
            params: {type: object}
        - if: {properties: {type: {enum: [price_above, price_below]}}}
          then: {required: [instrumentId], properties: {params: {$ref: '#/components/schemas/PriceThresholdParams'}}}
        - if: {properties: {type: {const: change_pct}}}
          then: {required: [instrumentId], properties: {params: {$ref: '#/components/schemas/ChangeParams'}}}
        - if: {properties: {type: {const: indicator}}}
          then: {required: [instrumentId], properties: {params: {$ref: '#/components/schemas/IndicatorAlertParams'}}}
        - if: {properties: {type: {const: portfolio_change}}}
          then: {properties: {params: {$ref: '#/components/schemas/ChangeParams'}}}
        - if: {properties: {type: {const: drawdown}}}
          then: {properties: {params: {$ref: '#/components/schemas/DrawdownAlertParams'}}}
        - if: {properties: {type: {const: allocation_drift}}}
          then: {properties: {params: {$ref: '#/components/schemas/AllocationDriftParams'}}}
        - if: {properties: {type: {const: earnings}}}
          then: {required: [instrumentId], properties: {params: {$ref: '#/components/schemas/EarningsAlertParams'}}}
        - if: {properties: {type: {const: news}}}
          then: {required: [instrumentId], properties: {params: {$ref: '#/components/schemas/NewsAlertParams'}}}
    AlertRulePatch:
      allOf:
        - {$ref: '#/components/schemas/AlertRuleSettings'}
        - type: object
          minProperties: 1
          properties:
            params: {type: object, description: 'Walidowane schematem właściwym dla typu reguły.'}
    AlertRule:
      allOf:
        - {$ref: '#/components/schemas/AlertRuleInput'}
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            instrument: {$ref: '#/components/schemas/InstrumentSummary'}
            lastTriggeredAt: {$ref: '#/components/schemas/Timestamp'}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
            updatedAt: {$ref: '#/components/schemas/Timestamp'}
    AlertRulePage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AlertRule'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    AlertEvent:
      type: object
      required: [id, ruleId, ruleType, triggeredAt, message, dataAsOf, dataSource]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        ruleId: {$ref: '#/components/schemas/Uuid'}
        ruleType: {$ref: '#/components/schemas/AlertRuleType'}
        instrument: {$ref: '#/components/schemas/InstrumentSummary'}
        triggeredAt: {$ref: '#/components/schemas/Timestamp'}
        value: {$ref: '#/components/schemas/DecimalString'}
        threshold: {$ref: '#/components/schemas/DecimalString'}
        message: {type: string, description: 'Treść bez języka rekomendacji (FR-05.07).', example: 'PKO: kurs 58,34 zł spadł poniżej progu 58,50 zł (dane 15:42, opóźnione 15 min).'}
        dataAsOf: {$ref: '#/components/schemas/Timestamp'}
        dataSource: {$ref: '#/components/schemas/DataSource'}
        deliveries:
          type: array
          items:
            type: object
            required: [channel, status]
            properties:
              channel: {$ref: '#/components/schemas/NotificationChannel'}
              status: {type: string, enum: [queued, sent, failed, skipped]}
              sentAt: {$ref: '#/components/schemas/Timestamp'}
    AlertEventPage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AlertEvent'}}
        page: {$ref: '#/components/schemas/PageInfo'}

    # ── education ──
    OnboardingState:
      type: object
      required: [step, updatedAt]
      properties:
        step: {type: string, example: import}
        completedAt: {$ref: '#/components/schemas/Timestamp'}
        skippedAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    OnboardingUpdate:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [advance, complete, skip, restart]}
        step: {type: string, pattern: '^[a-z0-9-]{2,40}$'}
    LearningProgressInput:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [started, completed]}
        score: {type: integer, minimum: 0, maximum: 100}
    LearningProgress:
      allOf:
        - {$ref: '#/components/schemas/LearningProgressInput'}
        - type: object
          required: [lessonKey, updatedAt]
          properties:
            lessonKey: {type: string}
            updatedAt: {$ref: '#/components/schemas/Timestamp'}
    DemoPortfolio:
      type: object
      required: [accountId, status]
      properties:
        accountId: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, enum: [creating, ready]}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        dataAsOf: {$ref: '#/components/schemas/LocalDate'}

    # ── quick ──
    QuickFreshness:
      type: object
      required: [asOf, stale, delayMinutes, source]
      properties:
        asOf: {$ref: '#/components/schemas/Timestamp'}
        stale: {type: boolean}
        delayMinutes: {type: integer, minimum: 0}
        source: {$ref: '#/components/schemas/DataSource'}
    QuickPortfolio:
      allOf:
        - {$ref: '#/components/schemas/QuickFreshness'}
        - type: object
          required: [totalValue, dayChange, dayChangeRatio, unrealizedPl]
          properties:
            totalValue: {$ref: '#/components/schemas/Money'}
            dayChange: {$ref: '#/components/schemas/Money'}
            dayChangeRatio: {type: [number, 'null']}
            unrealizedPl: {$ref: '#/components/schemas/Money'}
            topPositions:
              type: array
              maxItems: 5
              items:
                type: object
                required: [ticker, weight]
                properties:
                  ticker: {type: string}
                  weight: {type: number}
                  dayChangeRatio: {type: [number, 'null']}
    QuickMover:
      type: object
      required: [ticker, changeRatio]
      properties:
        ticker: {type: string}
        changeRatio: {type: number}
    QuickToday:
      allOf:
        - {$ref: '#/components/schemas/QuickFreshness'}
        - type: object
          required: [dayChange, dayChangeRatio]
          properties:
            dayChange: {$ref: '#/components/schemas/Money'}
            dayChangeRatio: {type: [number, 'null']}
            best: {$ref: '#/components/schemas/QuickMover'}
            worst: {$ref: '#/components/schemas/QuickMover'}
    QuickQuote:
      allOf:
        - {$ref: '#/components/schemas/QuickFreshness'}
        - type: object
          required: [ticker, name, mic, price, currency]
          properties:
            ticker: {type: string}
            name: {type: string}
            mic: {type: string}
            price: {$ref: '#/components/schemas/DecimalString'}
            currency: {$ref: '#/components/schemas/CurrencyCode'}
            changeRatio: {type: [number, 'null']}
    QuickTransactionInput:
      type: object
      required: [ticker, side, quantity, price]
      properties:
        accountId: {$ref: '#/components/schemas/Uuid'}
        accountName: {type: string, maxLength: 60, description: 'Alternatywa dla accountId (dokładna nazwa, bez rozróżniania wielkości liter). Brak obu: jedyny aktywny rachunek użytkownika (poza demo), a przy kilku — 422 z listą nazw w detail.'}
        ticker: {type: string, pattern: '^[A-Za-z0-9.\-]{1,20}$'}
        mic: {type: string, pattern: '^[A-Z0-9]{4}$'}
        side: {type: string, enum: [BUY, SELL]}
        quantity: {$ref: '#/components/schemas/QuickDecimal'}
        price: {$ref: '#/components/schemas/QuickDecimal'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        tradeDate: {$ref: '#/components/schemas/LocalDate'}
        fee: {$ref: '#/components/schemas/QuickDecimal'}
        note: {type: string, maxLength: 200}
        confirmDuplicate: {type: boolean, default: false, description: 'Potwierdzenie zapisu mimo ostrzeżenia o możliwym duplikacie (409).'}
    QuickDecimal:
      description: 'Liczba dodatnia jako ciąg z kropką lub przecinkiem (pole tekstowe Skrótu w pl-PL) albo liczba JSON (typ „Liczba” w akcji Słownik); serwer normalizuje do DecimalString.'
      oneOf:
        - {type: string, pattern: '^\d{1,14}([.,]\d{1,10})?$', example: '58,34'}
        - {type: number, exclusiveMinimum: 0, example: 58.34}
    QuickTransactionCreated:
      type: object
      required: [transactionId, accountId, instrument, summary]
      properties:
        transactionId: {$ref: '#/components/schemas/Uuid'}
        accountId: {$ref: '#/components/schemas/Uuid'}
        instrument: {$ref: '#/components/schemas/InstrumentSummary'}
        summary: {type: string}
    QuickAlerts:
      type: object
      required: [activeRules, triggered]
      properties:
        activeRules: {type: integer}
        triggered:
          type: array
          items:
            type: object
            required: [at, message]
            properties:
              at: {$ref: '#/components/schemas/Timestamp'}
              ticker: {type: string}
              message: {type: string}

    # ── admin ──
    AdminUser:
      type: object
      required: [id, email, name, role, banned, twoFactorEnabled, emailVerified, createdAt, activeSessions]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: string, format: email}
        name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        banned: {type: boolean}
        banReason: {type: string}
        banExpires: {$ref: '#/components/schemas/Timestamp'}
        twoFactorEnabled: {type: boolean}
        emailVerified: {type: boolean}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        lastActiveAt: {$ref: '#/components/schemas/Timestamp'}
        activeSessions: {type: integer}
        deletionScheduledFor: {$ref: '#/components/schemas/Timestamp'}
    AdminUserPage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AdminUser'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    AdminUserPatch:
      type: object
      minProperties: 1
      properties:
        role: {$ref: '#/components/schemas/Role'}
        banned: {type: boolean}
        banReason: {type: string, maxLength: 500}
        banExpires: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
      if: {properties: {banned: {const: true}}, required: [banned]}
      then: {required: [banReason]}
    AdminInvitationInput:
      type: object
      required: [email, role]
      properties:
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        expiresInHours: {type: integer, minimum: 1, maximum: 168, default: 72}
        sendEmail: {type: boolean, default: true}
    AdminInvitation:
      type: object
      required: [id, email, role, invitedBy, status, expiresAt, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        invitedBy: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, enum: [pending, used, expired, revoked]}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        usedAt: {$ref: '#/components/schemas/Timestamp'}
        revokedAt: {$ref: '#/components/schemas/Timestamp'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    AdminInvitationCreated:
      allOf:
        - {$ref: '#/components/schemas/AdminInvitation'}
        - type: object
          required: [inviteUrl]
          properties:
            inviteUrl: {type: string, format: uri, description: 'Pokazywany wyłącznie w tej odpowiedzi.'}
    AdminInvitationPage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AdminInvitation'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    AdminSession:
      type: object
      required: [id, userId, userEmail, createdAt, expiresAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        userId: {$ref: '#/components/schemas/Uuid'}
        userEmail: {type: string, format: email}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        ipAddress: {type: string}
        userAgent: {type: string}
        mfaVerifiedAt: {$ref: '#/components/schemas/Timestamp'}
    AdminSessionPage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AdminSession'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    FeatureFlagRules:
      type: object
      properties:
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}}
        users: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/Uuid'}}
    FeatureFlag:
      type: object
      required: [key, enabled, rules, updatedAt]
      properties:
        key: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        rules: {$ref: '#/components/schemas/FeatureFlagRules'}
        updatedBy: {$ref: '#/components/schemas/Uuid'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    FeatureFlagUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
        rules: {$ref: '#/components/schemas/FeatureFlagRules'}
    RoleLimitValues:
      type: object
      required: [analyticsHeavyPerDay, importsPerDay, personalAccessTokensMax, alertRulesMax, watchlistsMax]
      properties:
        analyticsHeavyPerDay: {type: [integer, 'null'], minimum: 0}
        importsPerDay: {type: integer, minimum: 0}
        personalAccessTokensMax: {type: integer, minimum: 0}
        alertRulesMax: {type: integer, minimum: 0}
        watchlistsMax: {type: integer, minimum: 0}
    RoleLimits:
      type: object
      required: [role, limits, updatedAt]
      properties:
        role: {$ref: '#/components/schemas/Role'}
        limits: {$ref: '#/components/schemas/RoleLimitValues'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    AuditEntry:
      type: object
      required: [id, occurredAt, actorType, action, resourceType, outcome]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        occurredAt: {$ref: '#/components/schemas/Timestamp'}
        actorType: {type: string, enum: [user, admin, system, pat]}
        actorUserId: {$ref: '#/components/schemas/Uuid'}
        actorRef: {type: string}
        action: {type: string, example: admin.flags.update}
        resourceType: {type: string}
        resourceId: {type: string}
        outcome: {type: string, enum: [success, denied, error]}
        ip: {type: string}
        userAgent: {type: string}
        requestId: {type: string}
        before: {type: object}
        after: {type: object}
    AuditEntryPage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    QueueSummary:
      type: object
      required: [name, paused, counts]
      properties:
        name: {type: string}
        paused: {type: boolean}
        workers: {type: integer}
        counts:
          type: object
          required: [waiting, active, delayed, failed, completed]
          properties:
            waiting: {type: integer}
            active: {type: integer}
            delayed: {type: integer}
            failed: {type: integer}
            completed: {type: integer}
    QueueJob:
      type: object
      required: [id, name, state, attemptsMade, createdAt]
      description: Wyłącznie metadane — treść zadania (np. wagi portfela) nie jest ujawniana administratorowi.
      properties:
        id: {type: string}
        name: {type: string}
        state: {type: string, enum: [waiting, active, delayed, failed, completed]}
        attemptsMade: {type: integer}
        maxAttempts: {type: integer}
        failedReason: {type: string, description: 'Komunikat błędu bez danych wejściowych.'}
        ownerUserId: {$ref: '#/components/schemas/Uuid'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        processedAt: {$ref: '#/components/schemas/Timestamp'}
        finishedAt: {$ref: '#/components/schemas/Timestamp'}
    QueueJobPage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/QueueJob'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    ProviderKey: {type: string, enum: [gpw, yahoo, nbp, frankfurter, finnhub, twelvedata, alphavantage, fred, gdelt, marketaux]}
    QuotaUsage:
      type: object
      required: [used, limit]
      properties:
        used: {type: integer}
        limit: {type: integer}
    ProviderStatus:
      type: object
      required: [id, enabled, circuit]
      properties:
        id: {$ref: '#/components/schemas/ProviderKey'}
        enabled: {type: boolean}
        circuit: {type: string, enum: [closed, open, half_open]}
        lastSuccessAt: {$ref: '#/components/schemas/Timestamp'}
        lastErrorAt: {$ref: '#/components/schemas/Timestamp'}
        lastError: {type: string}
        quota:
          type: object
          properties:
            minute: {$ref: '#/components/schemas/QuotaUsage'}
            day: {$ref: '#/components/schemas/QuotaUsage'}
        budget:
          type: object
          properties:
            dailyLimit: {type: integer, minimum: 0}
            perMinuteLimit: {type: integer, minimum: 0}
            reserveRatio: {type: number, minimum: 0, maximum: 0.9}
    ProviderUpdate:
      type: object
      minProperties: 1
      properties:
        enabled: {type: boolean}
        dailyLimit: {type: integer, minimum: 0}
        perMinuteLimit: {type: integer, minimum: 0}
        reserveRatio: {type: number, minimum: 0, maximum: 0.9}
    ProviderRefreshRequest:
      type: object
      properties:
        scope: {type: string, enum: [eod, intraday, fx, all], default: all}
        date: {$ref: '#/components/schemas/LocalDate'}
    SystemHealth:
      type: object
      required: [checkedAt, services]
      properties:
        checkedAt: {$ref: '#/components/schemas/Timestamp'}
        services:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: {type: string, enum: [web, api, jobs, analytics, postgres, valkey-queue, valkey-cache, caddy]}
              status: {type: string, enum: [up, degraded, down]}
              version: {type: string}
              uptimeSeconds: {type: integer}
        resources:
          type: object
          properties:
            cpuLoadRatio: {type: number}
            memoryUsedBytes: {type: integer}
            memoryTotalBytes: {type: integer}
            diskUsedBytes: {type: integer}
            diskTotalBytes: {type: integer}
        monitoringUrl: {type: string, format: uri-reference, description: 'Odnośnik do Uptime Kuma (tylko przez VPN).'}
    RumSummary:
      type: object
      required: [from, to, rows]
      properties:
        from: {$ref: '#/components/schemas/LocalDate'}
        to: {$ref: '#/components/schemas/LocalDate'}
        rows:
          type: array
          items:
            type: object
            required: [route, metric, p75, samples]
            properties:
              route: {type: string}
              deviceClass: {type: string}
              metric: {type: string, enum: [LCP, INP, CLS, FCP, TTFB]}
              p75: {type: number}
              samples: {type: integer}
              goodRatio: {type: number}
    MarketDataUpload:
      type: object
      required: [file, format]
      properties:
        file: {type: string, contentMediaType: application/octet-stream}
        format: {type: string, enum: [gpw_xls, stooq_csv]}
        sessionDate: {$ref: '#/components/schemas/LocalDate', description: 'Wymagane dla gpw_xls (dzień sesji pliku).'}
        instrumentId: {$ref: '#/components/schemas/Uuid', description: 'Wymagane dla stooq_csv (plik jednego instrumentu).'}
    MarketDataImport:
      type: object
      required: [id, format, fileName, status, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        format: {type: string, enum: [gpw_xls, stooq_csv]}
        fileName: {type: string}
        status: {type: string, enum: [queued, processing, done, failed]}
        summary:
          type: object
          properties:
            rows: {type: integer}
            inserted: {type: integer}
            updated: {type: integer}
            rejected: {type: integer}
            qualityIssues: {type: integer}
        error: {type: string}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        finishedAt: {$ref: '#/components/schemas/Timestamp'}
    InstrumentCorrection:
      type: object
      required: [reason]
      minProperties: 2
      properties:
        reason: {type: string, minLength: 5, maxLength: 500}
        isin: {type: string, pattern: '^[A-Z]{2}[A-Z0-9]{9}\d$'}
        ticker: {type: string, maxLength: 20}
        name: {type: string, maxLength: 120}
        sectorCode: {type: string, maxLength: 40}
        lotSize: {$ref: '#/components/schemas/DecimalString'}
        supportsFractional: {type: boolean}
        isActive: {type: boolean}
        delistedOn: {oneOf: [{$ref: '#/components/schemas/LocalDate'}, {type: 'null'}]}
    CorporateActionInput:
      type: object
      required: [instrumentId, type, exDate, reason]
      properties:
        instrumentId: {$ref: '#/components/schemas/Uuid'}
        type: {type: string, enum: [split, reverse_split, dividend, isin_change, name_change, delisting, rights_issue]}
        exDate: {$ref: '#/components/schemas/LocalDate'}
        recordDate: {$ref: '#/components/schemas/LocalDate'}
        payDate: {$ref: '#/components/schemas/LocalDate'}
        ratio: {$ref: '#/components/schemas/DecimalString'}
        amount: {$ref: '#/components/schemas/DecimalString'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        details: {type: object}
        reason: {type: string, minLength: 5, maxLength: 500}
    CorporateAction:
      allOf:
        - {$ref: '#/components/schemas/CorporateActionInput'}
        - type: object
          required: [id, source, createdAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            source: {type: string}
            confirmedBy: {$ref: '#/components/schemas/Uuid'}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
    DataQualityIssue:
      type: object
      required: [id, checkCode, severity, status, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        instrumentId: {$ref: '#/components/schemas/Uuid'}
        sessionDate: {$ref: '#/components/schemas/LocalDate'}
        checkCode: {type: string, example: PRICE_JUMP_NO_CORPORATE_ACTION}
        severity: {type: string, enum: [BLOCK, WARN, INFO]}
        details: {type: object}
        status: {type: string, enum: [open, resolved, ignored]}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        resolvedAt: {$ref: '#/components/schemas/Timestamp'}
        resolvedBy: {$ref: '#/components/schemas/Uuid'}
    DataQualityIssuePage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/DataQualityIssue'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    DataQualityResolution:
      type: object
      required: [status, reason]
      properties:
        status: {type: string, enum: [resolved, ignored]}
        reason: {type: string, minLength: 5, maxLength: 500}
    CalendarEventInput:
      type: object
      required: [type, date, title]
      properties:
        instrumentId: {$ref: '#/components/schemas/Uuid'}
        type: {type: string, enum: [earnings, macro, dividend, other]}
        date: {$ref: '#/components/schemas/LocalDate'}
        time: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
        title: {type: string, minLength: 3, maxLength: 160}
        details: {type: object}
