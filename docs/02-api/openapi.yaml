# Cel: normatywny kontrakt HTTP OligInvest (REST /api/v1 + wybrane trasy Better Auth) dla implementacji w apps/api i klientów (PWA, Skróty iOS, HTTP Shortcuts).
# Zasady ogólne: docs/02-api/konwencje-api.md; strumień SSE: docs/02-api/realtime.md; model danych: docs/03-dane/model-danych.md.
# W CI specyfikacja generowana z Zod (@hono/zod-openapi) jest porównywana z tym plikiem (test spójności) — rozbieżność = czerwony build.
openapi: 3.1.0
info:
  title: OligInvest API
  version: 1.0.0-draft.1
  summary: Prywatne API analizy inwestycji — portfel, dane rynkowe (opóźnione/EOD), analizy scenariuszowe, alerty.
  description: |
    **Cel:** jeden kontrakt dla wszystkich klientów OligInvest; `apps/api` jest jedyną granicą domenową (ADR-012).

    **Status:** szkic projektowy (Krok 4). Operacje oznaczone `x-requirements` wskazują wymagania z
    `docs/00-przeglad/wymagania.md`; priorytet i etap realizacji wynikają z wymagań i z `docs/08-plan/backlog.md`.

    **Konwencje (skrót, pełna wersja w `konwencje-api.md`):**
    - kwoty pieniężne jako obiekt `Money` z kwotą w postaci ciągu dziesiętnego; ilości i ceny jako ciągi dziesiętne;
    - stopy, udziały i wskaźniki jako liczby JSON będące ułamkami (`0.0054` = 0,54 %);
    - serie do wykresów jako kolumnowe tablice liczb (`t` = czas uniksowy w sekundach, UTC);
    - dane rynkowe i wyceny zawsze z obiektem `meta` (`DataMeta`) — nieaktualne dane to `200` z `meta.stale = true`, nie błąd;
    - błędy jako Problem Details (RFC 9457) z polem `code`;
    - paginacja kursorem (`limit`, `cursor`), zakresy dat `from`/`to` włącznie;
    - `Idempotency-Key` wymagany tam, gdzie operacja ma `x-idempotency: required`;
    - `x-step-up: true` = wymagana weryfikacja TOTP nie starsza niż 15 min (`POST /me/step-up`), inaczej `403 STEP_UP_REQUIRED`;
    - `x-permission` = uprawnienie RBAC z `docs/01-architektura/moduly.md` § 6; `x-feature-flag` = flaga, której wyłączenie daje `404`.

    **Bramka MFA:** sesja bez skonfigurowanego TOTP otrzymuje `403 MFA_ENROLLMENT_REQUIRED` na wszystkich operacjach
    poza trasami `/api/auth/two-factor/*`, `/api/auth/sign-out` i `GET /me`.

    **Zgodność:** odpowiedzi modułu `analytics` zawierają blok `compliance` i `assumptions`; to materiały analityczne
    i edukacyjne, nie rekomendacje inwestycyjne w rozumieniu MiFID II (`docs/11-zgodnosc-prawna.md`, Krok 6).
servers:
  - url: https://{host}/api/v1
    description: Instancja produkcyjna (host roboczy do potwierdzenia — Q-01).
    variables:
      host:
        default: invest.oligi.pl
        description: Wartość zmiennej środowiskowej PUBLIC_BASE_URL bez schematu.
security:
  - sessionCookie: []
tags:
  - name: health
    description: Sondy stanu usługi (bez uwierzytelniania, bez szczegółów wewnętrznych).
  - name: platform
    description: Specyfikacja, strumień SSE, telemetria wydajności (RUM).
  - name: auth
    description: |
      Wybrane trasy Better Auth 1.7 (`/api/auth/*`). Opis orientacyjny — źródłem prawdy jest specyfikacja generowana
      wtyczką OpenAPI Better Auth; ścieżki sprawdzone w dokumentacji v1.6.23. Trasy `/two-factor/disable` i publiczna
      rejestracja bez zaproszenia są blokowane hookiem (2FA obowiązkowe, FR-07.01, FR-07.04).
  - name: identity
    description: Profil, preferencje, step-up, tokeny PAT, RODO (eksport, usunięcie konta), zaproszenia.
  - name: notifications
    description: Subskrypcje Web Push, preferencje kanałów, historia doręczeń.
  - name: market
    description: Instrumenty, notowania (opóźnione i EOD), wykresy, wskaźniki, FX, heatmapa, screener, kalendarz, newsy, watchlisty.
  - name: portfolio
    description: Rachunki, operacje, import, pozycje, gotówka, wyceny, wyniki, ryzyko, dywidendy, dziennik, alokacja docelowa, eksport.
  - name: analytics
    description: Analizy scenariuszowe (Monte Carlo, optymalizacja, testy skrajne, „co jeśli”, backtest, cel, rebalancing).
  - name: alerts
    description: Reguły alertów i historia wyzwoleń.
  - name: education
    description: Onboarding, postęp nauki, tryb demo (treści edukacyjne są plikami statycznymi w `web`).
  - name: quick
    description: Uproszczone endpointy dla automatyzacji (Skróty iOS, HTTP Shortcuts) — wyłącznie PAT, kontrakt zamrożony (tylko zmiany addytywne).
  - name: admin
    description: Panel administratora — bez wglądu w dane finansowe użytkowników (FR-08.01); każda operacja trafia do audytu (FR-08.10).
x-tagGroups:
  - name: Platforma i tożsamość
    tags: [health, platform, auth, identity, notifications]
  - name: Moduły fundamentowe
    tags: [market, portfolio]
  - name: Moduły funkcjonalne
    tags: [analytics, alerts, education, quick, admin]
paths:
  # ───────────────────────────── health / platform ─────────────────────────────
  /health/live:
    get:
      operationId: getHealthLive
      summary: Sonda żywotności procesu api
      tags: [health]
      security: []
      x-requirements: [FR-08.08]
      responses:
        '200': {description: 'Proces działa.', content: {application/json: {schema: {$ref: '#/components/schemas/HealthStatus'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /health/ready:
    get:
      operationId: getHealthReady
      summary: Sonda gotowości (PostgreSQL, valkey-queue, valkey-cache)
      description: Zwraca wyłącznie `ok`/`fail` per zależność — bez wersji, adresów i komunikatów wewnętrznych.
      tags: [health]
      security: []
      x-requirements: [FR-08.08]
      responses:
        '200': {description: 'Gotowy do obsługi ruchu.', content: {application/json: {schema: {$ref: '#/components/schemas/HealthStatus'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {description: 'Co najmniej jedna zależność niedostępna.', content: {application/json: {schema: {$ref: '#/components/schemas/HealthStatus'}}}}
  /openapi.json:
    get:
      operationId: getOpenApiDocument
      summary: Specyfikacja OpenAPI generowana z Zod
      tags: [platform]
      security: []
      x-requirements: [NFR-02.05]
      responses:
        '200': {description: 'Dokument OpenAPI 3.1.', content: {application/json: {schema: {type: object}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /stream:
    get:
      operationId: openEventStream
      summary: Strumień zdarzeń SSE użytkownika
      description: |
        Kontrakt zdarzeń, heartbeat, wznawianie (`Last-Event-ID`) i fallback na odpytywanie: `realtime.md`.
        Maks. 5 równoczesnych strumieni na użytkownika (szósty → `429`).
      tags: [platform]
      x-requirements: [FR-02.03, NFR-01.06]
      parameters:
        - {name: Last-Event-ID, in: header, required: false, description: 'Identyfikator ostatniego odebranego zdarzenia (wznawianie).', schema: {type: string, maxLength: 64}}
      responses:
        '200':
          description: Strumień `text/event-stream` (połączenie długotrwałe).
          headers:
            Cache-Control: {description: 'Zawsze `no-store`.', schema: {type: string}}
          content:
            text/event-stream:
              schema: {type: string}
              example: "event: ready\nid: 0\ndata: {\"v\":1,\"connectionId\":\"0192f0c4-7b1e-7c3a-9f00-3d2a1b4c5d6e\",\"retryMs\":5000}\n\n"
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /stream/connections/{connectionId}/instruments:
    put:
      operationId: setStreamInstruments
      summary: Ustaw dodatkowe instrumenty śledzone przez połączenie SSE
      description: |
        Instrumenty z otwartych ekranów (np. karta instrumentu) spoza pozycji i watchlist. Zbiór zastępowany w całości,
        ważny do końca połączenia. Maks. 50 identyfikatorów.
      tags: [platform]
      x-permission: market:read
      x-requirements: [FR-01.02, NFR-01.06]
      parameters:
        - {name: connectionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StreamInstrumentSet'}
      responses:
        '204': {description: 'Zbiór zapisany.'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /rum/web-vitals:
    post:
      operationId: reportWebVitals
      summary: Zgłoś pomiary Core Web Vitals z przeglądarki (RUM)
      description: Wysyłane przez `navigator.sendBeacon`; bez identyfikatora użytkownika w zapisie (`platform.web_vitals`).
      tags: [platform]
      x-requirements: [NFR-01.01]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebVitalsReport'}
      responses:
        '204': {description: 'Przyjęto.'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ───────────────────────────── auth (Better Auth, /api/auth) ─────────────────────────────
  /sign-up/email:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    post:
      operationId: authSignUpEmail
      summary: Rejestracja z zaproszenia (e-mail i hasło)
      description: |
        Hook `before` weryfikuje `invitationToken` (`identity.find_invitation`), wymusza zgodność e-maila z zaproszeniem,
        długość hasła ≥ 12 i brak hasła w bazie wycieków (k-anonimowość); hook `after` zużywa zaproszenie
        (`identity.consume_invitation`) i nadaje rolę. Bez ważnego zaproszenia → `403`.
      tags: [auth]
      security: []
      x-requirements: [FR-07.01, FR-07.02]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthSignUpRequest'}
      responses:
        '200': {description: 'Konto utworzone; e-mail weryfikacyjny wysłany; kolejny krok — konfiguracja TOTP.', content: {application/json: {schema: {$ref: '#/components/schemas/AuthSessionResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /sign-in/email:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    post:
      operationId: authSignInEmail
      summary: Logowanie e-mailem i hasłem (pierwszy składnik)
      description: Dla konta z 2FA odpowiedź zawiera `twoFactorRedirect = true`; sesja staje się pełna po `/two-factor/verify-totp`.
      tags: [auth]
      security: []
      x-requirements: [FR-07.02, NFR-03.02]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthSignInRequest'}
      responses:
        '200': {description: 'Pierwszy składnik poprawny.', content: {application/json: {schema: {$ref: '#/components/schemas/AuthSignInResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /sign-in/social:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    post:
      operationId: authSignInSocial
      summary: Logowanie OAuth (Google, GitHub) — pierwszy składnik
      description: Po powrocie z dostawcy sesja ma `mfa_verified_at = NULL` i przechodzi przez bramkę MFA (Z-04).
      tags: [auth]
      security: []
      x-feature-flag: auth.oauth
      x-requirements: [FR-07.03]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthSocialSignInRequest'}
      responses:
        '200': {description: 'Adres przekierowania do dostawcy.', content: {application/json: {schema: {$ref: '#/components/schemas/AuthRedirectResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /sign-out:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    post:
      operationId: authSignOut
      summary: Wylogowanie bieżącej sesji
      tags: [auth]
      x-requirements: [FR-07.05]
      responses:
        '200': {description: 'Sesja unieważniona.', content: {application/json: {schema: {$ref: '#/components/schemas/AuthStatusResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /get-session:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    get:
      operationId: authGetSession
      summary: Bieżąca sesja i użytkownik
      tags: [auth]
      x-requirements: [FR-07.04]
      responses:
        '200': {description: 'Sesja lub `null`.', content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AuthSessionResponse'}, {type: 'null'}]}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /request-password-reset:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    post:
      operationId: authRequestPasswordReset
      summary: Wyślij jednorazowy link resetu hasła (ważny 30 min)
      description: Odpowiedź identyczna niezależnie od istnienia konta (brak enumeracji użytkowników).
      tags: [auth]
      security: []
      x-requirements: [FR-07.10]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthPasswordResetRequest'}
      responses:
        '200': {description: 'Przyjęto.', content: {application/json: {schema: {$ref: '#/components/schemas/AuthStatusResponse'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /reset-password:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    post:
      operationId: authResetPassword
      summary: Ustaw nowe hasło tokenem z e-maila (unieważnia wszystkie sesje)
      tags: [auth]
      security: []
      x-requirements: [FR-07.10]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthResetPasswordRequest'}
      responses:
        '200': {description: 'Hasło zmienione; wymagane ponowne logowanie z TOTP.', content: {application/json: {schema: {$ref: '#/components/schemas/AuthStatusResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /change-password:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    post:
      operationId: authChangePassword
      summary: Zmiana hasła zalogowanego użytkownika
      tags: [auth]
      x-requirements: [FR-07.02, NFR-03.03]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthChangePasswordRequest'}
      responses:
        '200': {description: 'Hasło zmienione.', content: {application/json: {schema: {$ref: '#/components/schemas/AuthStatusResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /two-factor/enable:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    post:
      operationId: authTwoFactorEnable
      summary: Rozpocznij konfigurację TOTP (sekret i 10 kodów zapasowych)
      description: 2FA staje się aktywne dopiero po `verify-totp`. Ponowne wywołanie przy aktywnym 2FA (zmiana urządzenia) wymaga step-up.
      tags: [auth]
      x-requirements: [FR-07.04]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthPasswordConfirm'}
      responses:
        '200': {description: 'URI `otpauth://` do kodu QR i kody zapasowe (pokazywane jednorazowo).', headers: {Cache-Control: {description: '`no-store`', schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/AuthTwoFactorEnableResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /two-factor/verify-totp:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    post:
      operationId: authTwoFactorVerifyTotp
      summary: Zweryfikuj kod TOTP (logowanie lub zakończenie konfiguracji)
      description: Sukces ustawia `auth.sessions.mfa_verified_at`. Blokada po 5 błędnych kodach (NFR-03.02).
      tags: [auth]
      x-requirements: [FR-07.04, NFR-03.02]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthTotpVerifyRequest'}
      responses:
        '200': {description: 'Drugi składnik poprawny.', content: {application/json: {schema: {$ref: '#/components/schemas/AuthSessionResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /two-factor/verify-backup-code:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    post:
      operationId: authTwoFactorVerifyBackupCode
      summary: Zaloguj kodem zapasowym (jednorazowym)
      tags: [auth]
      x-requirements: [FR-07.04]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthBackupCodeVerifyRequest'}
      responses:
        '200': {description: 'Drugi składnik poprawny; kod zużyty.', content: {application/json: {schema: {$ref: '#/components/schemas/AuthSessionResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /two-factor/generate-backup-codes:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    post:
      operationId: authTwoFactorGenerateBackupCodes
      summary: Wygeneruj nowy komplet kodów zapasowych (unieważnia poprzednie)
      tags: [auth]
      x-step-up: true
      x-requirements: [FR-07.04]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthPasswordConfirm'}
      responses:
        '200': {description: 'Nowe kody (pokazywane jednorazowo).', content: {application/json: {schema: {$ref: '#/components/schemas/AuthBackupCodesResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /list-sessions:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    get:
      operationId: authListSessions
      summary: Lista aktywnych sesji (urządzeń) użytkownika
      tags: [auth]
      x-requirements: [FR-07.05]
      responses:
        '200': {description: 'Sesje użytkownika.', content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AuthSessionInfo'}}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /revoke-session:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    post:
      operationId: authRevokeSession
      summary: Wyloguj wskazane urządzenie
      tags: [auth]
      x-requirements: [FR-07.05]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthRevokeSessionRequest'}
      responses:
        '200': {description: 'Sesja unieważniona (skutek ≤ 60 s na wszystkich instancjach).', content: {application/json: {schema: {$ref: '#/components/schemas/AuthStatusResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /revoke-other-sessions:
    servers: [{url: 'https://{host}/api/auth', variables: {host: {default: invest.oligi.pl}}}]
    post:
      operationId: authRevokeOtherSessions
      summary: Wyloguj wszystkie inne urządzenia („wyloguj wszędzie”)
      tags: [auth]
      x-requirements: [FR-07.05]
      responses:
        '200': {description: 'Pozostałe sesje unieważnione.', content: {application/json: {schema: {$ref: '#/components/schemas/AuthStatusResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}

  # ───────────────────────────── identity (/api/v1) ─────────────────────────────
  /invitations/{token}:
    get:
      operationId: getInvitationPreview
      summary: Sprawdź zaproszenie przed rejestracją
      description: Nieważne, wygasłe, użyte i nieistniejące zaproszenie dają ten sam `404`. Limit 10 / min / IP.
      tags: [identity]
      security: []
      x-requirements: [FR-07.01]
      parameters:
        - {name: token, in: path, required: true, schema: {type: string, minLength: 32, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}}
      responses:
        '200': {description: 'Zaproszenie ważne.', headers: {Cache-Control: {description: '`no-store`', schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationPreview'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /me:
    get:
      operationId: getMe
      summary: Profil, rola, stan MFA, uprawnienia i efektywne flagi
      description: Dostępne także przed konfiguracją TOTP (bramka MFA) — klient kieruje wtedy do konfiguracji.
      tags: [identity]
      x-requirements: [FR-07.04, FR-07.06, FR-08.04]
      responses:
        '200': {description: 'Dane bieżącego użytkownika.', content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    patch:
      operationId: updateMe
      summary: Zmień nazwę wyświetlaną
      tags: [identity]
      x-requirements: [FR-07.08]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MePatch'}
      responses:
        '200': {description: 'Zaktualizowano.', content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
