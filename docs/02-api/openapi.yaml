components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-oliginvest.session_token
      description: |
        Ciasteczko sesji Better Auth (`HttpOnly`, `Secure`, `SameSite=Lax`). Nazwa zależy od `advanced.cookiePrefix`
        (❓ do potwierdzenia przy implementacji). Metody modyfikujące wymagają nagłówka `Origin` zgodnego z hostem (CSRF).
    bearerPat:
      type: http
      scheme: bearer
      bearerFormat: oli_pat_<losowe>
      description: |
        Token PAT (wtyczka API key Better Auth; w bazie skrót SHA-256). Wyłącznie trasy `/quick/*`.
        Zakresy: `portfolio:read`, `transactions:write`, `alerts:read`, `market:read` — brak zakresu → `403 PAT_SCOPE_MISSING`.

  parameters:
    IdempotencyKey:
      {name: Idempotency-Key, in: header, required: true, description: 'Klucz generowany przez klienta: UUID (zalecany) lub 16–64 znaków [A-Za-z0-9_-] (Skróty iOS nie mają generatora UUID); przechowywany 24 h per użytkownik.', schema: {$ref: '#/components/schemas/IdempotencyKeyValue'}}
    IdempotencyKeyOptional:
      {name: Idempotency-Key, in: header, required: false, schema: {$ref: '#/components/schemas/IdempotencyKeyValue'}}
    Limit:
      {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    Cursor:
      {name: cursor, in: query, required: false, description: 'Nieprzezroczysty kursor z `page.nextCursor`.', schema: {type: string, maxLength: 512}}
    From:
      {name: from, in: query, required: false, description: 'Początek zakresu (włącznie).', schema: {type: string, format: date}}
    To:
      {name: to, in: query, required: false, description: 'Koniec zakresu (włącznie); brak = dziś (Europe/Warsaw).', schema: {type: string, format: date}}
    AsOf:
      {name: asOf, in: query, required: false, description: 'Stan na koniec dnia (brak = bieżący).', schema: {type: string, format: date}}
    MaxPoints:
      {name: maxPoints, in: query, required: false, description: 'Maks. liczba punktów po decymacji (NFR-01.04).', schema: {type: integer, minimum: 50, maximum: 3000, default: 1500}}
    PlView:
      {name: view, in: query, required: false, description: '`economic` = kursy brokera; `tax` = kursy NBP z dnia D−1 (art. 11a ustawy o PIT). Brak = preferencja użytkownika.', schema: {type: string, enum: [economic, tax]}}
    QuickFormat:
      {name: format, in: query, required: false, schema: {type: string, enum: [json, text], default: json}}
    AccountId:
      {name: accountId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    AccountIds:
      {name: accountId, in: query, required: false, description: 'Powtarzalny; brak = wszystkie rachunki (bez rachunku demo).', schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Uuid'}}, style: form, explode: true}
    InstrumentId:
      {name: instrumentId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    InstrumentIdQuery:
      {name: instrumentId, in: query, required: false, schema: {$ref: '#/components/schemas/Uuid'}}
    TransactionId:
      {name: transactionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ImportId:
      {name: importId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    WatchlistId:
      {name: watchlistId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    EntryId:
      {name: entryId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    TargetId:
      {name: targetId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    RunId:
      {name: runId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    RuleId:
      {name: ruleId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    StrategyId:
      {name: strategyId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    UserId:
      {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ExportId:
      {name: exportId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    QueueName:
      {name: queueName, in: path, required: true, schema: {type: string, enum: [ingest, import, recompute, alerts, notify, analytics, analytics-results, events]}}
    JobId:
      {name: jobId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9:_-]{1,128}$'}}
    ProviderId:
      {name: providerId, in: path, required: true, schema: {$ref: '#/components/schemas/ProviderKey'}}

  headers:
    Location:
      description: Adres zasobu (utworzonego lub statusu operacji asynchronicznej).
      schema: {type: string, format: uri-reference}
    ETag:
      description: Skrót treści; klient wysyła `If-None-Match`.
      schema: {type: string}
    IdempotentReplayed:
      description: '`true`, gdy odpowiedź jest powtórką dla tego samego `Idempotency-Key`.'
      schema: {type: string, enum: ['true']}
    RetryAfter:
      description: Sekundy do ponowienia.
      schema: {type: integer, minimum: 1}
    RateLimit:
      description: Stan limitu wg draft-ietf-httpapi-ratelimit-headers-11 (np. `"default";r=12;t=30`).
      schema: {type: string}
    RateLimitPolicy:
      description: Polityka limitu (np. `"default";q=300;w=60`).
      schema: {type: string}
    XRequestId:
      description: Identyfikator korelacji (także w polu `instance` błędu, w logach i zadaniach).
      schema: {type: string, maxLength: 64}

  responses:
    NotModified:
      description: Treść bez zmian (`If-None-Match`).
    BadRequest:
      description: Niepoprawna składnia żądania.
      headers: {X-Request-Id: {$ref: '#/components/headers/XRequestId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}, example: {type: 'https://invest.oligi.pl/problems/bad-request', title: 'Niepoprawne żądanie', status: 400, code: BAD_REQUEST, instance: req_01J8Z3Q6X4}}}
    Unauthenticated:
      description: Brak, wygasła lub unieważniona sesja albo token PAT.
      headers: {X-Request-Id: {$ref: '#/components/headers/XRequestId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}, example: {type: 'https://invest.oligi.pl/problems/unauthenticated', title: 'Wymagane logowanie', status: 401, code: UNAUTHENTICATED, instance: req_01J8Z3Q6X4}}}
    Forbidden:
      description: Brak uprawnienia, brak 2FA, wymagany step-up lub brak zakresu PAT (rozróżnia `code`).
      headers: {X-Request-Id: {$ref: '#/components/headers/XRequestId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}, example: {type: 'https://invest.oligi.pl/problems/step-up-required', title: 'Potwierdź kodem z aplikacji uwierzytelniającej', status: 403, code: STEP_UP_REQUIRED, instance: req_01J8Z3Q6X4}}}
    NotFound:
      description: Brak zasobu, zasób innego użytkownika lub moduł wyłączony flagą.
      headers: {X-Request-Id: {$ref: '#/components/headers/XRequestId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}, example: {type: 'https://invest.oligi.pl/problems/not-found', title: 'Nie znaleziono', status: 404, code: NOT_FOUND, instance: req_01J8Z3Q6X4}}}
    Conflict:
      description: Konflikt stanu, idempotencji, duplikat importu lub niejednoznaczny instrument (`candidates`).
      headers: {X-Request-Id: {$ref: '#/components/headers/XRequestId'}, Retry-After: {$ref: '#/components/headers/RetryAfter'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}, example: {type: 'https://invest.oligi.pl/problems/instrument-ambiguous', title: 'Niejednoznaczny ticker', status: 409, code: INSTRUMENT_AMBIGUOUS, instance: req_01J8Z3Q6X4, candidates: [{id: 0192f0c4-7b1e-7c3a-9f00-3d2a1b4c5d6e, ticker: ABC, name: ABC SA, mic: XWAR, currency: PLN, type: stock, isActive: true}]}}}
    PreconditionFailed:
      description: Warunek wstępny niespełniony (np. nieuzgodnione dane).
      headers: {X-Request-Id: {$ref: '#/components/headers/XRequestId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}, example: {type: 'https://invest.oligi.pl/problems/reconciliation-required', title: 'Najpierw uzgodnij dane rachunku', status: 412, code: RECONCILIATION_REQUIRED, instance: req_01J8Z3Q6X4}}}
    PayloadTooLarge:
      description: Plik większy niż 10 MB.
      headers: {X-Request-Id: {$ref: '#/components/headers/XRequestId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    UnsupportedMediaType:
      description: Nieobsługiwany typ pliku lub nierozpoznany format eksportu brokera.
      headers: {X-Request-Id: {$ref: '#/components/headers/XRequestId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    ValidationFailed:
      description: Błąd walidacji (Zod) lub parametry analizy poza granicami.
      headers: {X-Request-Id: {$ref: '#/components/headers/XRequestId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}, example: {type: 'https://invest.oligi.pl/problems/validation-failed', title: 'Nieprawidłowe dane', status: 422, code: VALIDATION_FAILED, detail: 'Pole quantity musi być dodatnie.', instance: req_01J8Z3Q6X4, errors: [{path: quantity, code: too_small, message: 'Wartość musi być > 0'}]}}}
    RateLimited:
      description: Przekroczony limit żądań lub dzienny limit roli.
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        RateLimit: {$ref: '#/components/headers/RateLimit'}
        RateLimit-Policy: {$ref: '#/components/headers/RateLimitPolicy'}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}

  schemas:
    # ── typy podstawowe ──
    Uuid: {type: string, format: uuid, description: 'UUIDv7.', example: 0192f0c4-7b1e-7c3a-9f00-3d2a1b4c5d6e}
    IdempotencyKeyValue: {type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$', example: 0192f0c4-7b1e-7c3a-9f00-3d2a1b4c5d6e}
    Timestamp: {type: string, format: date-time, description: 'RFC 3339 w UTC z `Z`.', example: '2026-09-18T15:42:07Z'}
    LocalDate: {type: string, format: date, example: '2026-09-18'}
    CurrencyCode: {type: string, pattern: '^[A-Z]{3}$', description: 'ISO 4217.', example: PLN}
    DecimalString: {type: string, pattern: '^-?\d{1,14}(\.\d{1,10})?$', description: 'Liczba dziesiętna jako ciąg (ilości, ceny, kursy).', example: '119.84'}
    MoneyAmount: {type: string, pattern: '^-?\d{1,14}(\.\d{1,8})?$', description: 'Kwota z kropką dziesiętną, maks. 8 miejsc, bez separatorów tysięcy.', example: '1234.56'}
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: {$ref: '#/components/schemas/MoneyAmount'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
      example: {amount: '280.45', currency: PLN}
    NumberSeries:
      type: array
      description: Kolumna liczb wyrównana do osi `t`; `null` = brak wartości (np. rozgrzewka wskaźnika, dzień bez sesji).
      items: {type: [number, 'null']}
    TimeAxis:
      type: array
      description: Czas uniksowy w sekundach (UTC); dla danych dziennych — północ UTC dnia sesji.
      items: {type: integer}
    Role: {type: string, enum: [user, pro, admin]}
    DataSource:
      type: string
      description: Rozszerzalne (nowe wartości dodawane bez zmiany wersji — klient toleruje nieznane).
      enum: [gpw, gpw_manual, yahoo, stooq_manual, nbp, ecb, finnhub, twelvedata, alphavantage, fred, gdelt, marketaux, broker_import, computed, demo, mixed]
    StaleReason:
      type: string
      enum: [market_closed, provider_quota, provider_error, provider_disabled, no_data, eod_only, data_quality_hold]
    DataMeta:
      type: object
      description: Świeżość i pochodzenie danych (FR-01.15) — UI pokazuje zawsze.
      required: [source, asOf, delayMinutes, stale]
      properties:
        source: {$ref: '#/components/schemas/DataSource'}
        asOf: {$ref: '#/components/schemas/Timestamp'}
        delayMinutes: {type: integer, minimum: 0, description: 'Deklarowane opóźnienie źródła (EOD = 0 z `asOf` po sesji).'}
        stale: {type: boolean}
        staleReason: {$ref: '#/components/schemas/StaleReason'}
        attribution: {type: string, maxLength: 200, description: 'Tekst atrybucji źródła (NFR-07.03).'}
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        hasMore: {type: boolean}
        nextCursor: {type: string, maxLength: 512}
    ProblemCode:
      type: string
      enum: [BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, MFA_REQUIRED, MFA_ENROLLMENT_REQUIRED, STEP_UP_REQUIRED, PAT_SCOPE_MISSING,
             NOT_FOUND, CONFLICT, IDEMPOTENCY_CONFLICT, INSTRUMENT_AMBIGUOUS, DUPLICATE_IMPORT, RECONCILIATION_REQUIRED,
             FILE_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, IMPORT_FORMAT_UNKNOWN, VALIDATION_FAILED, PARAMETERS_OUT_OF_BOUNDS,
             RATE_LIMITED, QUOTA_EXCEEDED, INTERNAL, SERVICE_UNAVAILABLE]
    Problem:
      type: object
      description: Problem Details (RFC 9457) z rozszerzeniami OligInvest.
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string, description: 'Krótki opis po polsku.'}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {$ref: '#/components/schemas/ProblemCode'}
        detail: {type: string}
        instance: {type: string, description: 'Identyfikator żądania (`X-Request-Id`).'}
        errors:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path: {type: string}
              code: {type: string}
              message: {type: string}
        candidates:
          type: array
          description: Tylko `INSTRUMENT_AMBIGUOUS`.
          items: {$ref: '#/components/schemas/InstrumentSummary'}
        existingImportId: {$ref: '#/components/schemas/Uuid'}
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, fail]}
        checks:
          type: object
          additionalProperties: {type: string, enum: [ok, fail]}
          example: {postgres: ok, valkeyQueue: ok, valkeyCache: ok}
    JobAccepted:
      type: object
      required: [jobId, queue]
      properties:
        jobId: {type: string}
        queue: {type: string}
    AdminReason:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 5, maxLength: 500, description: 'Uzasadnienie zapisywane w audycie.'}
    StreamInstrumentSet:
      type: object
      required: [instrumentIds]
      properties:
        instrumentIds: {type: array, maxItems: 50, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
    WebVitalsReport:
      type: object
      required: [metrics]
      properties:
        route: {type: string, maxLength: 120, description: 'Wzorzec trasy bez identyfikatorów (np. `/instrument/[id]`).'}
        deviceClass: {type: string, enum: [mobile, tablet, desktop]}
        connection: {type: string, enum: [slow-2g, 2g, 3g, 4g, unknown]}
        metrics:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [name, value, rating]
            properties:
              name: {type: string, enum: [LCP, INP, CLS, FCP, TTFB]}
              value: {type: number, minimum: 0}
              rating: {type: string, enum: [good, needs-improvement, poor]}

    # ── auth (Better Auth) ──
    AuthSignUpRequest:
      type: object
      required: [name, email, password, invitationToken]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        email: {type: string, format: email}
        password: {type: string, minLength: 12, maxLength: 128}
        invitationToken: {type: string, minLength: 32, maxLength: 128}
    AuthSignInRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 1, maxLength: 128}
        rememberMe: {type: boolean, default: true}
    AuthSignInResponse:
      type: object
      properties:
        twoFactorRedirect: {type: boolean, description: '`true` — wymagany drugi składnik (`/two-factor/verify-totp`).'}
        user: {$ref: '#/components/schemas/AuthUser'}
    AuthSocialSignInRequest:
      type: object
      required: [provider]
      properties:
        provider: {type: string, enum: [google, github]}
        callbackURL: {type: string, pattern: '^/[^/]', description: 'Wyłącznie ścieżka względna w tej samej domenie (ochrona przed open redirect).'}
    AuthRedirectResponse:
      type: object
      required: [url]
      properties:
        url: {type: string, format: uri}
        redirect: {type: boolean}
    AuthUser:
      type: object
      required: [id, email, name, role, twoFactorEnabled]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: string, format: email}
        name: {type: string}
        emailVerified: {type: boolean}
        role: {$ref: '#/components/schemas/Role'}
        twoFactorEnabled: {type: boolean}
    AuthSessionResponse:
      type: object
      required: [session, user]
      properties:
        session:
          type: object
          required: [id, expiresAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            expiresAt: {$ref: '#/components/schemas/Timestamp'}
            mfaVerifiedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        user: {$ref: '#/components/schemas/AuthUser'}
    AuthStatusResponse:
      type: object
      properties:
        status: {type: boolean}
        message: {type: string}
    AuthPasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
        redirectTo: {type: string, pattern: '^/[^/]', description: 'Ścieżka formularza nowego hasła w `web`.'}
    AuthResetPasswordRequest:
      type: object
      required: [newPassword, token]
      properties:
        newPassword: {type: string, minLength: 12, maxLength: 128}
        token: {type: string, maxLength: 256}
    AuthChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, maxLength: 128}
        newPassword: {type: string, minLength: 12, maxLength: 128}
        revokeOtherSessions: {type: boolean, default: true}
    AuthPasswordConfirm:
      type: object
      required: [password]
      properties:
        password: {type: string, maxLength: 128}
    AuthTwoFactorEnableResponse:
      type: object
      required: [totpURI, backupCodes]
      properties:
        totpURI: {type: string, pattern: '^otpauth://totp/'}
        backupCodes: {type: array, minItems: 10, maxItems: 10, items: {type: string}}
    AuthBackupCodesResponse:
      type: object
      required: [backupCodes]
      properties:
        backupCodes: {type: array, minItems: 10, maxItems: 10, items: {type: string}}
    AuthTotpVerifyRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: '^\d{6}$'}
        trustDevice: {type: boolean, default: false, description: 'Domyślnie wyłączone — każde logowanie wymaga TOTP.'}
    AuthBackupCodeVerifyRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, minLength: 8, maxLength: 16}
    AuthSessionInfo:
      type: object
      required: [id, createdAt, expiresAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        ipAddress: {type: string}
        userAgent: {type: string}
        token: {type: string, description: 'Identyfikator sesji wymagany przez `/revoke-session`.'}
    AuthRevokeSessionRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, maxLength: 256}

    # ── identity ──
    InvitationPreview:
      type: object
      required: [emailMasked, role, expiresAt]
      properties:
        emailMasked: {type: string, example: 'a***@e***.pl'}
        role: {$ref: '#/components/schemas/Role'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
    Me:
      type: object
      required: [id, email, name, role, mfa, permissions, features, preferences]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: string, format: email}
        name: {type: string}
        emailVerified: {type: boolean}
        role: {$ref: '#/components/schemas/Role'}
        mfa:
          type: object
          required: [enrolled]
          properties:
            enrolled: {type: boolean}
            sessionVerifiedAt: {$ref: '#/components/schemas/Timestamp'}
            stepUpValidUntil: {$ref: '#/components/schemas/Timestamp'}
        permissions: {type: array, items: {type: string}, example: ['portfolio:read', 'analytics:run:light']}
        features:
          type: object
          description: Efektywne flagi dla użytkownika (klucz → włączona).
          additionalProperties: {type: boolean}
          example: {module.analytics: true, module.analytics.backtest: false}
        preferences: {$ref: '#/components/schemas/Preferences'}
        deletionScheduledFor: {$ref: '#/components/schemas/Timestamp'}
    MePatch:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
    Preferences:
      type: object
      required: [baseCurrency, costBasisMethod, plView, timezone, locale, theme, plPalette]
      properties:
        baseCurrency: {type: string, enum: [PLN], description: 'W MVP wyłącznie PLN (ADR-014).'}
        costBasisMethod: {type: string, enum: [fifo, average]}
        plView: {type: string, enum: [economic, tax]}
        timezone: {type: string, example: Europe/Warsaw}
        locale: {type: string, enum: [pl-PL, en-US]}
        theme: {type: string, enum: [system, light, dark]}
        plPalette: {type: string, enum: [default, colorblind]}
    PreferencesPatch:
      type: object
      minProperties: 1
      properties:
        costBasisMethod: {type: string, enum: [fifo, average]}
        plView: {type: string, enum: [economic, tax]}
        timezone: {type: string, maxLength: 64}
        locale: {type: string, enum: [pl-PL, en-US]}
        theme: {type: string, enum: [system, light, dark]}
        plPalette: {type: string, enum: [default, colorblind]}
    StepUpRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: '^\d{6}$'}
    StepUpResult:
      type: object
      required: [validUntil]
      properties:
        validUntil: {$ref: '#/components/schemas/Timestamp'}
    PatScope: {type: string, enum: ['portfolio:read', 'transactions:write', 'alerts:read', 'market:read']}
    PersonalAccessToken:
      type: object
      required: [id, name, start, scopes, createdAt, expiresAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        start: {type: string, description: 'Początek tokenu do rozpoznania (np. `oli_pat_Ab12`).', example: oli_pat_Ab12}
        scopes: {type: array, items: {$ref: '#/components/schemas/PatScope'}}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        lastUsedAt: {$ref: '#/components/schemas/Timestamp'}
    PersonalAccessTokenCreate:
      type: object
      required: [name, scopes]
      properties:
        name: {type: string, minLength: 1, maxLength: 60, example: iPhone — Skróty}
        scopes: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/PatScope'}}
        expiresInDays: {type: integer, minimum: 1, maximum: 365, default: 90}
    PersonalAccessTokenCreated:
      allOf:
        - {$ref: '#/components/schemas/PersonalAccessToken'}
        - type: object
          required: [token]
          properties:
            token: {type: string, description: 'Pełna wartość — pokazywana wyłącznie w tej odpowiedzi.'}
    DataExport:
      type: object
      required: [id, status, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, enum: [queued, running, ready, failed, expired]}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        sizeBytes: {type: integer, minimum: 0}
    DeletionRequest:
      type: object
      required: [id, requestedAt, scheduledFor]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        requestedAt: {$ref: '#/components/schemas/Timestamp'}
        scheduledFor: {$ref: '#/components/schemas/Timestamp'}
        cancelledAt: {$ref: '#/components/schemas/Timestamp'}

    # ── notifications ──
    PushSubscriptionCreate:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: {type: string, format: uri, pattern: '^https://', maxLength: 1024}
        expirationTime: {type: [number, 'null']}
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: {type: string, maxLength: 200}
            auth: {type: string, maxLength: 100}
        deviceLabel: {type: string, maxLength: 60, example: iPhone}
    PushSubscription:
      type: object
      required: [id, createdAt, failureCount]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        deviceLabel: {type: string}
        userAgent: {type: string}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        lastSuccessAt: {$ref: '#/components/schemas/Timestamp'}
        failureCount: {type: integer, minimum: 0}
    NotificationChannel: {type: string, enum: [push, email]}
    NotificationPreferences:
      type: object
      required: [channels, emailFallback]
      properties:
        channels:
          type: object
          required: [push, email]
          properties:
            push: {type: boolean}
            email: {type: boolean}
        quietHours:
          description: Lokalna strefa użytkownika; `null` = brak ciszy. Alerty bezpieczeństwa ignorują ciche godziny.
          oneOf:
            - type: object
              required: [start, end]
              properties:
                start: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '22:00'}
                end: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '07:00'}
            - {type: 'null'}
        emailFallback: {type: boolean, description: 'E-mail, gdy brak aktywnej subskrypcji push (FR-05.06).'}
    NotificationDelivery:
      type: object
      required: [id, kind, channel, status, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string, enum: [alert, system, export, invitation, security]}
        channel: {$ref: '#/components/schemas/NotificationChannel'}
        status: {type: string, enum: [queued, sent, failed, skipped]}
        error: {type: string}
        sourceRef: {type: string, description: 'Np. identyfikator zdarzenia alertu.'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        sentAt: {$ref: '#/components/schemas/Timestamp'}
    NotificationDeliveryPage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/NotificationDelivery'}}
        page: {$ref: '#/components/schemas/PageInfo'}

    # ── market ──
    InstrumentType: {type: string, enum: [stock, etf, etc, etn, index, fx, commodity, bond, fund, crypto]}
    ChartInterval: {type: string, enum: [15m, 1h, 1d, 1w, 1mo], default: 1d}
    InstrumentSummary:
      type: object
      required: [id, ticker, name, mic, currency, type, isActive]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        ticker: {type: string, example: PKO}
        name: {type: string, example: PKO Bank Polski SA}
        isin: {type: string, pattern: '^[A-Z]{2}[A-Z0-9]{9}\d$', example: PLPKO0000016}
        mic: {type: string, pattern: '^[A-Z0-9]{4}$', example: XWAR}
        exchangeShortName: {type: string, example: GPW}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        type: {$ref: '#/components/schemas/InstrumentType'}
        country: {type: string, pattern: '^[A-Z]{2}$'}
        isActive: {type: boolean}
    InstrumentSummaryPage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/InstrumentSummary'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    Instrument:
      allOf:
        - {$ref: '#/components/schemas/InstrumentSummary'}
        - type: object
          required: [lotSize, supportsFractional, dataSources]
          properties:
            assetClass: {type: string, enum: [equity, bond, cash, commodity, real_estate, crypto, mixed, other]}
            sector:
              type: object
              required: [code, name]
              properties:
                code: {type: string}
                name: {type: string}
            lotSize: {$ref: '#/components/schemas/DecimalString'}
            supportsFractional: {type: boolean}
            delistedOn: {$ref: '#/components/schemas/LocalDate'}
            dataSources:
              type: object
              description: Źródła wg kategorii; `null` = brak (np. brak intraday → tylko EOD).
              properties:
                eod: {oneOf: [{$ref: '#/components/schemas/DataSource'}, {type: 'null'}]}
                intraday: {oneOf: [{$ref: '#/components/schemas/DataSource'}, {type: 'null'}]}
            quote: {$ref: '#/components/schemas/Quote'}
            range52w:
              type: object
              required: [low, high]
              properties:
                low: {$ref: '#/components/schemas/DecimalString'}
                high: {$ref: '#/components/schemas/DecimalString'}
            avgTurnover20d: {$ref: '#/components/schemas/Money'}
    Quote:
      type: object
      required: [instrumentId, price, currency, meta]
      properties:
        instrumentId: {$ref: '#/components/schemas/Uuid'}
        price: {$ref: '#/components/schemas/DecimalString'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        prevClose: {$ref: '#/components/schemas/DecimalString'}
        change: {$ref: '#/components/schemas/DecimalString'}
        changeRatio: {type: number, description: 'Zmiana względem poprzedniego zamknięcia (ułamek).', example: -0.0085}
        volume: {$ref: '#/components/schemas/DecimalString'}
        sessionDate: {$ref: '#/components/schemas/LocalDate'}
        meta: {$ref: '#/components/schemas/DataMeta'}
    OhlcvSeries:
      type: object
      required: [instrumentId, interval, adjusted, currency, t, o, h, l, c, v, decimated, meta]
      properties:
        instrumentId: {$ref: '#/components/schemas/Uuid'}
        interval: {$ref: '#/components/schemas/ChartInterval'}
        adjusted: {type: boolean}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        t: {$ref: '#/components/schemas/TimeAxis'}
        o: {$ref: '#/components/schemas/NumberSeries'}
        h: {$ref: '#/components/schemas/NumberSeries'}
        l: {$ref: '#/components/schemas/NumberSeries'}
        c: {$ref: '#/components/schemas/NumberSeries'}
        v: {$ref: '#/components/schemas/NumberSeries'}
        decimated: {type: boolean, description: '`true`, gdy serię zagregowano do `maxPoints` (OHLC łączone, wolumen sumowany).'}
        corporateActions:
          type: array
          items:
            type: object
            required: [date, type]
            properties:
              date: {$ref: '#/components/schemas/LocalDate'}
              type: {type: string, enum: [split, reverse_split, dividend]}
              ratio: {$ref: '#/components/schemas/DecimalString'}
        meta: {$ref: '#/components/schemas/DataMeta'}
      example:
        instrumentId: 0192f0c4-7b1e-7c3a-9f00-3d2a1b4c5d6e
        interval: 1d
        adjusted: true
        currency: PLN
        t: [1758067200, 1758153600]
        o: [58.1, 58.6]
        h: [58.9, 58.8]
        l: [57.8, 58.1]
        c: [58.62, 58.34]
        v: [1843210, 1520344]
        decimated: false
        meta: {source: gpw, asOf: '2026-09-18T16:35:00Z', delayMinutes: 0, stale: false}
    IndicatorSeries:
      type: object
      required: [instrumentId, interval, t, indicators, meta]
      properties:
        instrumentId: {$ref: '#/components/schemas/Uuid'}
        interval: {$ref: '#/components/schemas/ChartInterval'}
        t: {$ref: '#/components/schemas/TimeAxis'}
        indicators:
          type: array
          items:
            type: object
            required: [spec, kind, outputs]
            properties:
              spec: {type: string, example: 'macd:12:26:9'}
              kind: {type: string, enum: [overlay, panel]}
              outputs:
                type: object
                description: 'Nazwane kolumny: `value` (SMA, EMA, RSI, ATR), `upper`/`middle`/`lower` (BB), `macd`/`signal`/`histogram` (MACD).'
                additionalProperties: {$ref: '#/components/schemas/NumberSeries'}
        meta: {$ref: '#/components/schemas/DataMeta'}
    VolumeProfile:
      type: object
      required: [instrumentId, from, to, method, bins, meta]
      properties:
        instrumentId: {$ref: '#/components/schemas/Uuid'}
        from: {$ref: '#/components/schemas/LocalDate'}
        to: {$ref: '#/components/schemas/LocalDate'}
        method: {type: string, enum: [daily_bar_uniform_split], description: 'Wolumen sesji rozkładany równomiernie na zakres high–low (przybliżenie).'}
        bins:
          type: array
          items:
            type: object
            required: [priceLow, priceHigh, volume]
            properties:
              priceLow: {type: number}
              priceHigh: {type: number}
              volume: {type: number}
        meta: {$ref: '#/components/schemas/DataMeta'}
    Benchmark:
      type: object
      required: [code, name, kind, instrumentId, currency]
      properties:
        code: {type: string, example: WIG20}
        name: {type: string}
        kind: {type: string, enum: [index, etf_proxy]}
        proxyFor: {type: string, description: 'Kod indeksu, który zastępuje ETF (gdy indeks niedostępny).'}
        instrumentId: {$ref: '#/components/schemas/Uuid'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        dataAvailableFrom: {$ref: '#/components/schemas/LocalDate'}
    FxRatesResponse:
      type: object
      required: [quote, series, meta]
      properties:
        quote: {type: string, enum: [PLN]}
        series:
          type: array
          items:
            type: object
            required: [currency, items]
            properties:
              currency: {$ref: '#/components/schemas/CurrencyCode'}
              items:
                type: array
                items:
                  type: object
                  required: [date, rate]
                  properties:
                    date: {$ref: '#/components/schemas/LocalDate'}
                    rate: {$ref: '#/components/schemas/DecimalString'}
                    tableNo: {type: string, example: 181/A/NBP/2026}
        meta: {$ref: '#/components/schemas/DataMeta'}
    MacroSeries:
      type: object
      required: [code, name, unit, frequency, t, values, meta]
      properties:
        code: {type: string, example: nbp.gold}
        name: {type: string}
        unit: {type: string, example: PLN/g}
        frequency: {type: string, enum: [daily, weekly, monthly, quarterly, annual]}
        t: {$ref: '#/components/schemas/TimeAxis'}
        values: {$ref: '#/components/schemas/NumberSeries'}
        meta: {$ref: '#/components/schemas/DataMeta'}
    Heatmap:
      type: object
      required: [market, period, sizeBy, sectors, meta]
      properties:
        market: {type: string, enum: [gpw, us]}
        period: {type: string}
        sizeBy: {type: string, enum: [turnover, market_cap]}
        sectors:
          type: array
          items:
            type: object
            required: [code, name, changeRatio, size, tiles]
            properties:
              code: {type: string}
              name: {type: string}
              changeRatio: {type: [number, 'null'], description: 'Zmiana ważona rozmiarem.'}
              size: {type: number}
              tiles:
                type: array
                items:
                  type: object
                  required: [instrumentId, ticker, changeRatio, size]
                  properties:
                    instrumentId: {$ref: '#/components/schemas/Uuid'}
                    ticker: {type: string}
                    name: {type: string}
                    changeRatio: {type: [number, 'null']}
                    size: {type: number}
        meta: {$ref: '#/components/schemas/DataMeta'}
    ScreenerCriterion:
      type: object
      required: [field, operator, value]
      properties:
        field:
          type: string
          description: Pola fundamentalne (`peRatio`, `pbRatio`, `dividendYield`, `marketCap`) wyłącznie dla USA, gdy dostępne.
          enum: [price, changeRatio1d, changeRatio1w, changeRatio1m, changeRatioYtd, volume, turnover, avgTurnover20d, rsi14,
                 distanceToSma50Ratio, distanceToSma200Ratio, sma50AboveSma200, distanceToHigh52wRatio, distanceToLow52wRatio,
                 atr14Ratio, peRatio, pbRatio, dividendYield, marketCap]
        operator: {type: string, enum: [gt, gte, lt, lte, between, eq]}
        value:
          oneOf:
            - {type: number}
            - {type: boolean}
            - {type: array, minItems: 2, maxItems: 2, items: {type: number}}
    ScreenerUniverse:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [gpw_all, index_members, us_etf, watchlist]}
        indexCode: {type: string, enum: [WIG20, mWIG40, sWIG80, WIG]}
        watchlistId: {$ref: '#/components/schemas/Uuid'}
    ScreenerQuery:
      type: object
      required: [universe, criteria]
      properties:
        universe: {$ref: '#/components/schemas/ScreenerUniverse'}
        asOf: {$ref: '#/components/schemas/LocalDate'}
        criteria: {type: array, minItems: 1, maxItems: 15, items: {$ref: '#/components/schemas/ScreenerCriterion'}}
        sort:
          type: object
          required: [field]
          properties:
            field: {type: string}
            direction: {type: string, enum: [asc, desc], default: asc}
        limit: {type: integer, minimum: 1, maximum: 200, default: 50}
        cursor: {type: string, maxLength: 512}
    ScreenerResultPage:
      type: object
      required: [data, page, universe, meta, disclaimerKey]
      properties:
        data:
          type: array
          items:
            type: object
            required: [instrument, values, matched]
            properties:
              instrument: {$ref: '#/components/schemas/InstrumentSummary'}
              values: {type: object, additionalProperties: {type: [number, boolean, 'null']}}
              matched: {type: array, items: {type: string}, description: 'Opisy spełnionych warunków (pl-PL).'}
        page: {$ref: '#/components/schemas/PageInfo'}
        universe:
          type: object
          required: [size, asOf]
          properties:
            size: {type: integer}
            asOf: {$ref: '#/components/schemas/LocalDate'}
        meta: {$ref: '#/components/schemas/DataMeta'}
        disclaimerKey: {type: string, example: screener.v1}
    ScreenerPresetInput:
      type: object
      required: [name, universe, criteria]
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        universe: {$ref: '#/components/schemas/ScreenerUniverse'}
        criteria: {type: array, minItems: 1, maxItems: 15, items: {$ref: '#/components/schemas/ScreenerCriterion'}}
    ScreenerPreset:
      allOf:
        - {$ref: '#/components/schemas/ScreenerPresetInput'}
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
            updatedAt: {$ref: '#/components/schemas/Timestamp'}
    CalendarEvent:
      type: object
      required: [id, type, date, title, source]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        instrument: {$ref: '#/components/schemas/InstrumentSummary'}
        type: {type: string, enum: [earnings, macro, dividend, other]}
        date: {$ref: '#/components/schemas/LocalDate'}
        time: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
        title: {type: string}
        details: {type: object}
        source: {type: string, enum: [alphavantage, fmp, fred, admin]}
    CalendarEventPage:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/CalendarEvent'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    NewsItem:
      type: object
      required: [id, publishedAt, title, url, sourceDomain]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        instrumentId: {$ref: '#/components/schemas/Uuid'}
        market: {type: string, enum: [gpw, us, global]}
        publishedAt: {$ref: '#/components/schemas/Timestamp'}
        title: {type: string}
        url: {type: string, format: uri}
        sourceDomain: {type: string}
        language: {type: string, example: pl}
        tone: {type: number, description: 'Ton GDELT (średnia; skala dostawcy).'}
        sentimentScore: {type: number, minimum: -1, maximum: 1}
        sentimentSource: {type: string, enum: [marketaux, alphavantage]}
    NewsPage:
      type: object
      required: [data, page, methodology]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/NewsItem'}}
        page: {$ref: '#/components/schemas/PageInfo'}
        methodology: {type: string, description: 'Klucz opisu metody tonu i sentymentu (FR-01.13).', example: news-tone.v1}
    MarketDataStatus:
      type: object
      required: [asOf, categories]
      properties:
        asOf: {$ref: '#/components/schemas/Timestamp'}
        categories:
          type: array
          items:
            type: object
            required: [key, status]
            properties:
              key: {type: string, enum: [gpw_eod, intraday_gpw, intraday_us, fx, news, macro, fundamentals]}
              status: {type: string, enum: [ok, degraded, down, disabled]}
              lastSuccessAt: {$ref: '#/components/schemas/Timestamp'}
              staleReason: {$ref: '#/components/schemas/StaleReason'}
              message: {type: string}
    WatchlistInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 40}
    WatchlistPatch:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 40}
        position: {type: integer, minimum: 0}
    Watchlist:
      type: object
      required: [id, name, position, itemCount, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        position: {type: integer}
        itemCount: {type: integer, minimum: 0}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    WatchlistItemInput:
      type: object
      required: [instrumentId]
      properties:
        instrumentId: {$ref: '#/components/schemas/Uuid'}
        note: {type: string, maxLength: 280}
    WatchlistItemPatch:
      type: object
      minProperties: 1
      properties:
        note: {type: [string, 'null'], maxLength: 280}
        position: {type: integer, minimum: 0}
    WatchlistItem:
      type: object
      required: [instrument, position, addedAt]
      properties:
        instrument: {$ref: '#/components/schemas/InstrumentSummary'}
        note: {type: string}
        position: {type: integer}
        addedAt: {$ref: '#/components/schemas/Timestamp'}
        quote: {$ref: '#/components/schemas/Quote'}
    WatchlistDetail:
      allOf:
        - {$ref: '#/components/schemas/Watchlist'}
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/WatchlistItem'}}

    # ── portfolio ──
    Broker: {type: string, enum: [xtb, mbank, other, demo]}
    AccountType: {type: string, enum: [regular, ike, ikze, demo]}
    AccountInput:
      type: object
      required: [name, broker, accountType, currency]
      properties:
        name: {type: string, minLength: 1, maxLength: 60, example: XTB — zwykły}
        broker: {$ref: '#/components/schemas/Broker'}
        accountType: {$ref: '#/components/schemas/AccountType'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        externalRef: {type: string, maxLength: 40, description: 'Własna etykieta (np. końcówka numeru); nie przechowujemy pełnych numerów rachunków ani haseł do brokera.'}
        openedOn: {$ref: '#/components/schemas/LocalDate'}
    AccountPatch:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        accountType: {$ref: '#/components/schemas/AccountType'}
        externalRef: {type: [string, 'null'], maxLength: 40}
        closedOn: {oneOf: [{$ref: '#/components/schemas/LocalDate'}, {type: 'null'}]}
    Account:
      allOf:
        - {$ref: '#/components/schemas/AccountInput'}
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            closedOn: {$ref: '#/components/schemas/LocalDate'}
            lastImportAt: {$ref: '#/components/schemas/Timestamp'}
            reconciliationStatus: {type: string, enum: [ok, differences, never_imported]}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
            updatedAt: {$ref: '#/components/schemas/Timestamp'}
    TransactionType:
      type: string
      description: Semantyka i znaki — `obliczenia-finansowe.md` § 1.
      enum: [BUY, SELL, DIVIDEND, INTEREST, FEE, TAX, DEPOSIT, WITHDRAWAL, CASH_TRANSFER_IN, CASH_TRANSFER_OUT,
             FX_CONVERSION, SPLIT, SECURITY_TRANSFER_IN, SECURITY_TRANSFER_OUT, ADJUSTMENT]
    TransactionFields:
      type: object
      properties:
        executedAt: {$ref: '#/components/schemas/Timestamp'}
        settleDate: {$ref: '#/components/schemas/LocalDate'}
        sequence: {type: integer, minimum: 0, description: 'Kolejność w obrębie dnia.'}
        instrumentId: {$ref: '#/components/schemas/Uuid'}
        quantity: {$ref: '#/components/schemas/DecimalString'}
        price: {$ref: '#/components/schemas/DecimalString'}
        priceCurrency: {$ref: '#/components/schemas/CurrencyCode'}
        amount: {$ref: '#/components/schemas/Money', description: 'Wpływ na gotówkę ze znakiem w walucie rozliczenia (DIVIDEND = netto). Dla BUY/SELL pominięte → liczone przez serwer.'}
        fee: {$ref: '#/components/schemas/Money'}
        tax: {$ref: '#/components/schemas/Money', description: 'Np. podatek u źródła dywidendy (wartość dodatnia).'}
        fxRate: {$ref: '#/components/schemas/DecimalString', description: 'Kurs brokera price_currency → waluta rozliczenia.'}
        fxSource: {type: string, enum: [broker, implied, nbp_fallback, manual]}
        splitRatio: {$ref: '#/components/schemas/DecimalString', description: 'Nowe akcje za 1 dotychczasową (4:1 → "4").'}
        counterAmount: {$ref: '#/components/schemas/Money', description: 'Druga noga FX_CONVERSION.'}
        category: {type: string, maxLength: 40, example: cfd_pl}
        relatedTransactionId: {$ref: '#/components/schemas/Uuid'}
        note: {type: string, maxLength: 500}
    TransactionInput:
      description: Wymagalność pól odpowiada ograniczeniom CHECK w `portfolio.transactions` (`schema.sql`).
      allOf:
        - {$ref: '#/components/schemas/TransactionFields'}
        - type: object
          required: [accountId, type, tradeDate]
          properties:
            accountId: {$ref: '#/components/schemas/Uuid'}
            type: {$ref: '#/components/schemas/TransactionType'}
            tradeDate: {$ref: '#/components/schemas/LocalDate'}
        - if: {properties: {type: {enum: [BUY, SELL, SECURITY_TRANSFER_IN, SECURITY_TRANSFER_OUT]}}}
          then: {required: [instrumentId, quantity]}
        - if: {properties: {type: {enum: [BUY, SELL]}}}
          then: {required: [price, priceCurrency]}
        - if: {properties: {type: {enum: [DIVIDEND, SPLIT]}}}
          then: {required: [instrumentId]}
        - if: {properties: {type: {const: SPLIT}}}
          then: {required: [splitRatio]}
        - if: {properties: {type: {const: FX_CONVERSION}}}
          then: {required: [amount, counterAmount]}
        - if: {properties: {type: {enum: [DIVIDEND, INTEREST, FEE, TAX, DEPOSIT, WITHDRAWAL, CASH_TRANSFER_IN, CASH_TRANSFER_OUT, ADJUSTMENT]}}}
          then: {required: [amount]}
