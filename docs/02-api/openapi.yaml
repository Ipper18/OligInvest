  # ───────────────────────────── analytics ─────────────────────────────
  /analytics/runs:
    get:
      operationId: listAnalyticsRuns
      summary: Historia analiz użytkownika
      tags: [analytics]
      x-permission: analytics:run:light
      x-feature-flag: module.analytics
      x-requirements: [FR-04.01]
      parameters:
        - {name: type, in: query, required: false, schema: {type: array, items: {$ref: '#/components/schemas/AnalyticsRunType'}}, style: form, explode: true}
        - {name: status, in: query, required: false, schema: {type: array, items: {$ref: '#/components/schemas/AnalyticsRunStatus'}}, style: form, explode: true}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: 'Analizy (bez pełnych wyników).', content: {application/json: {schema: {$ref: '#/components/schemas/AnalyticsRunPage'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createAnalyticsRun
      summary: Uruchom analizę (Monte Carlo, optymalizacja, testy skrajne, „co jeśli”, backtest, cel, rebalancing)
      description: |
        `rebalance` liczy `packages/core` synchronicznie w `api` → `201` z wynikiem. Pozostałe typy trafiają do kolejki
        `analytics` (worker Python bez internetu) → `202` ze statusem `queued`; postęp zdarzeniami SSE `analytics.run.*`.
        Typy ciężkie (`monte_carlo`, `optimization`, `stress_test`, `backtest`, `goal`) wymagają `analytics:run:heavy`
        i podlegają dziennemu limitowi roli (`429 QUOTA_EXCEEDED`). Parametry poza granicami → `422 PARAMETERS_OUT_OF_BOUNDS`.
        Rebalancing przy nieuzgodnionym imporcie → `412 RECONCILIATION_REQUIRED`.
      tags: [analytics]
      x-permission: analytics:run:light | analytics:run:heavy (wg typu)
      x-feature-flag: module.analytics
      x-idempotency: required
      x-requirements: [FR-04.01, FR-04.02, FR-04.03, FR-04.04, FR-04.05, FR-04.06, FR-04.08, FR-04.09, NFR-01.07, NFR-07.02]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnalyticsRunInput'}
      responses:
        '201': {description: 'Analiza lekka policzona synchronicznie (`status = done`).', headers: {Location: {$ref: '#/components/headers/Location'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyticsRun'}}}}
        '202': {description: 'Analiza w kolejce.', headers: {Location: {$ref: '#/components/headers/Location'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AnalyticsRun'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
