[project]
name = "oliginvest-analytics"
version = "0.0.0"
description = "Worker analityczny OligInvest"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bullmq==3.2.8",
    "jsonschema==4.26.0",
    "numpy==2.5.4",
    "psycopg[binary]==3.3.5",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "ruff==0.16.8",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "hypothesis==6.168.0",
  "setuptools==84.0.0",
  "empyrical-reloaded==0.5.12",
]

[tool.uv]
required-version = "==0.12.16"
exclude-newer = "3 days"
# empyrical-reloaded declares peewee<3.17.4 (sdist only) but never imports it.
exclude-dependencies = ["peewee"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oliginvest_analytics = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
