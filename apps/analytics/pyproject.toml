[project]
name = "oliginvest-analytics"
version = "0.0.0"
description = "Szkielet workera analitycznego OligInvest"
requires-python = ">=3.13,<3.14"
dependencies = ["bullmq==3.2.2", "psycopg[binary]==3.3.5"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "ruff==0.16.8",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "hypothesis==6.168.0",
  "setuptools==84.0.0",
]

[tool.uv]
required-version = "==0.12.16"
exclude-newer = "3 days"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
