id = "GO-2026-6860"
ignoreUntil = 2026-11-03
reason = "approved=2026-10-27; R-50: golang.org/x/net v0.60.0 in the Caddy binary; the flaw is in golang.org/x/net/html (quadratic text-node coalescing). Our Caddyfile is a reverse proxy and static file server without templates or markdown, so Caddy does not parse untrusted HTML. No severity is published, which the image gate treats as blocking. The only fix, v0.62.0, is inside the 72-hour release window. Owner accepted this exception for 7 days on 2026-10-27; no overrides."

