reason = "approved=2026-10-23; R-43: The owner approved 30 days on 2026-10-23 and extended the exception on 2026-11-22 to 2026-12-06 (44 days total). Only zod 3.25.76 is affected, a development-only dependency of Lighthouse 13.5.0 through puppeteer-core 25.12.0 and chromium-bidi 17.0.2. No 3.x fix exists. Production images exclude this dependency. Lighthouse drives Chrome over CDP and does not use the BiDi parser. Of 211 chromium-bidi releases checked from 157 onward, none had SLSA provenance. pnpm trustPolicy no-downgrade rejects that downgrade. Application packages use zod 4.6.7. No overrides or audit fix. Review upstream on 2026-12-04."
