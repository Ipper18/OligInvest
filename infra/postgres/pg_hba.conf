# Same user and OS identity for local administration / pgBackRest.
local all postgres peer
local all all reject
# samenet restricts TCP to directly attached Docker networks; explicit roles only.
host oliginvest oliginvest_owner samenet scram-sha-256
host oliginvest oliginvest_auth samenet scram-sha-256
host oliginvest oliginvest_app samenet scram-sha-256
host oliginvest oliginvest_analytics_ro samenet scram-sha-256
host oliginvest oliginvest_backup samenet scram-sha-256
host all all all reject
